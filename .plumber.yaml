# Plumber trust policy over the pipeline's third-party components: what may be
# used, from whom, pinned how. Read by the `plumber` job in
# .github/workflows/plumber.yml.
#
# This file is an OVERLAY, not a full policy, and that is the whole point.
#
# ## Why it changed shape
#
# The previous version enumerated every control by hand, 492 lines of them, and
# an enumerated `github.controls` map is EXHAUSTIVE: a control Plumber ships
# after the file is written is not "default-enabled", it is **absent**, and
# absent means disabled. Measured on 2026-11-09 against plumber 0.7.23:
#
#   52 GitHub controls in the catalogue
#   19 declared in this file
#   33 absent, and therefore off
#
# Six of them were reported as "Skipped (disabled in configuration)" while only
# ONE was actually disabled on purpose here. The score the badge showed was
# 100/100; with every control active it is 89/100. That is the exact failure
# mode this repository has a rule about: a number that measures a shrinking
# subset reads identically to a number that measures everything.
#
# `extends: plumber:default` inherits the baseline AND every control added to it
# later, so a new control arrives enabled and is triaged by a red run rather
# than by nobody. What follows is only what is deliberately changed.
#
# See the effective result with `plumber config resolve`, and the deltas with
# `plumber config diff`. Never `plumber config generate` over this file: it
# writes the full template and the decisions below go with it.
#
# ## What is NOT here any more, and why that is safe
#
# The `gitlab:` section. It was 517 lines of controls for a forge this project
# does not use, and the previous file had already dropped it; `plumber config
# slim` wants to write it back as a wall of `enabled: false`. Under `extends`
# that is unnecessary: plumber resolves the provider from the git remote, and a
# GitHub repository never evaluates the GitLab controls.
#
# The curated action allowlist. The old file carried its own copy of Plumber's
# list, 11 entries, and set `minimumStars: 0`, which disarms the star threshold
# entirely. Measured: of those 11, **ten are covered by the baseline**
# (step-security, ossf, google, anchore, sigstore, docker x3, and actions/ and
# github/ through `trustGithubOfficialActions`). Only one is not, and it is
# below.

extends: plumber:default
version: "2.0"

github:
  controls:
    # softprops/action-gh-release is the one action here that no baseline rule
    # clears, and the control is working as intended: it refuses to decide on
    # our behalf and asks for the decision in writing. Here it is.
    #
    # It publishes the release with its assets (release.yml), which is the step
    # RELEASING.md's promise rests on: the binaries, their checksums, the
    # signature and the provenance go out together, or the release keeps that
    # promise in appearance only. It is pinned by commit SHA
    # (efb35369e0ad2afab669f228072c1b0d510eae64, v3.0.3), so the pin bounds what
    # a compromise of that repository could do to this one.
    #
    # Scoped to this one action rather than `softprops/*`, and
    # includePlumberDefaults keeps the curated list underneath rather than
    # replacing it, which is the mistake the previous file made.
    githubActionMustComeFromAuthorizedSources:
      includePlumberDefaults: true
      trustedGithubActions:
        - softprops/action-gh-release

    # Repository governance; needs a token with Administration:read and abstains
    # without one, which is why the plumber job carries ADMIN_READ_TOKEN.
    #
    # `main` and nothing else, where the old file listed main, master,
    # release/*, production and dev. Four of those five do not exist here, and
    # listing a branch pattern that does not exist is not free: on 2026-10-26 a
    # release branch named `release/0.14.0` matched `release/*`, was unprotected
    # because nothing protects a branch created minutes earlier, and reddened
    # this job. The branch was renamed to chore/release-0-14-0 to get the run
    # green. A pattern nobody intends to protect turns a trust gate into an
    # obstacle course, and the next person reaches for --no-verify.
    branchMustBeProtected:
      namePatterns:
        - main

# ## The one finding that remains, and why it is not silenced
#
# `plumber analyze` reports ONE ISSUE-307 (LOW, latent) for
# checkoutMustNotPersistCredentials, and it is not silenced: that control takes
# only `enabled`, with no per-job exemption, so hiding one known case would
# switch the check off for every future workflow too.
#
# It is osv-scanner.yml, and the checkout is inside
# google/osv-scanner-action's reusable workflow, line 78 of their file. Not ours
# to set. Reaching 100 means replacing that dependency with the verified binary
# this repository already uses for actionlint, poutine, zizmor and plumber —
# which is the shape pavois settled on for the same control, having found
# aquasecurity/setup-trivy persisting a token the same way. Its own change, its
# own measurement.
#
# There were three. The two others were the `propose` jobs of drift.yml and
# corpus-cloud.yml, and this file previously argued they could not be fixed:
# they push a branch, so they needed what checkout leaves in .git/config, and
# the only alternatives moved the secret to another file on the same runner —
# satisfying the scanner and reducing nothing.
#
# That was wrong, and the correction is worth recording because the wrong
# version was the comfortable one. A credential helper that reads the token from
# its own environment removes the finding AND the file: git calls it when the
# remote asks, the literal ${GH_TOKEN} reaches argv instead of its value, and
# nothing is written to disk. Proved in a throwaway repository with a known
# token before it was written into either workflow. +2 points each, measured:
# 94 -> 98.
#
# So the threshold in plumber.yml is 98, the score measured with every control
# active. A gate whose threshold is aspirational is a gate that reds on every
# run and then gets removed; one set above what was measured is the same gate
# with better intentions.
