# The fixture repository #190 asks for: one declaration, driven by `feint up`
# and `feint down` on every pull request, with --vm off.
#
# It declares no infrastructure on purpose. What is under test is the verb, not
# a provider: the ready conditions are the emulator's own answers, so this runs
# on a runner with nothing installed but the binary itself.
version: 1

cloud:
  provider: scaleway
  # The declared project catalogue (#572), here because this is the only
  # declaration any suite drives through `feint up`: without it the flag would
  # travel from the schema to `start` to `serve` with nothing ever reading the
  # answer, which is what `mise run testplan` says about this diff in its own
  # words — "a flag no declaration names is unexercised".
  projects:
    - default
    - platform-prod

emulator:
  addr: 127.0.0.1:4599
  log_level: info

runtime:
  mode: off

ready:
  - http:/_feint/health
  - http:/instance/v1/zones/fr-par-1/servers
  - tcp:127.0.0.1:4599
