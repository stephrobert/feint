# The environment this stack needs, declared once. See docs/environment.md.
#
# Applied in CI from 2026-09-05, on the published provider, from v0.71.0.
#
# Why that version, dated rather than erased. Up to 0.70.0 the published
# provider built two clients and honoured EXOSCALE_API_ENDPOINT for one of
# them, so an apply or destroy split between the emulator and the real cloud:
# #525 measured a `feint down` in this very directory sending five signed
# requests to api-ch-*.exoscale.com, and the stack was suspended for ten days
# (2026-08-26 to 2026-09-05, docs/limits.md). Upstream fixed the v2 client in
# exoscale/terraform-provider-exoscale#576, and #644 measured the published
# v0.71.0 against this emulator before believing the release note: not one
# request left for the real cloud. The *.tf beside this file pins >= 0.71.0,
# and the emulator refuses an older provider by user agent, naming the floor.
#
# There is no `endpoint` variable here, and that is not an omission: the
# Exoscale provider has no such attribute. It reads EXOSCALE_API_ENDPOINT
# (with the /v2 path inside the value), which comes from the pack's own
# environment, the same one `feint env exoscale` prints.
version: 1

cloud:
  provider: exoscale

emulator:
  addr: 127.0.0.1:4599

runtime:
  mode: off
  # The template this stack resolves ("Linux Ubuntu 24.04 LTS 64-bit") maps to
  # ubuntu:24.04. Checked before anything starts, once the mode is not `off`.
  images:
    - ubuntu/24.04

iac:
  engine: terraform
  directory: .

ready:
  - http:/v2/instance
  - resource:compute-instance:1
  - resource:private-network:2
  - resource:instance-pool:1
