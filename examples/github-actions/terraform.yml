# Test a Terraform configuration against Scaleway in GitHub Actions — with no
# cloud account, no credentials and nothing billed.
#
# Copy this into `.github/workflows/` of a repository holding a Terraform
# configuration. There is no secret to add, because there is no account to
# authenticate to: the emulator parses the shape of a credential and verifies
# nothing, which is what lets a real client start against fake values.
#
# Two ways to run it, and this file shows the one a CI reads best — the emulator
# as a service container. The other is the action beside this file:
#
#     - uses: stephrobert/setup-feint@v1
#       with:
#         version: 0.9.0
#         provider: scaleway
#
# which installs the verified binary and exports the client environment. Use the
# service when the job already runs in containers; use the action when it does
# not, or when you want `--vm` on a host that has Incus.

name: Terraform against a local cloud

on:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  terraform:
    name: apply, re-plan, destroy
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      feint:
        # One tag per release, and no `latest`: a mutable reference pulls
        # whatever is newest, which is an image nobody can name afterwards.
        image: ghcr.io/stephrobert/feint:v0.8.0
        ports:
          - 4599:4599

    env:
      # Well-formed and meaningless. The Scaleway SDK validates the *format* of
      # these before it sends anything, so they are fake in the only way that
      # still lets the real client start.
      SCW_ACCESS_KEY: SCWXXXXXXXXXXXXXXXXX
      SCW_SECRET_KEY: 11111111-1111-1111-1111-111111111111
      SCW_DEFAULT_PROJECT_ID: 11111111-1111-1111-1111-111111111111
      SCW_DEFAULT_ORGANIZATION_ID: 11111111-1111-1111-1111-111111111111
      SCW_DEFAULT_ZONE: fr-par-1
      SCW_DEFAULT_REGION: fr-par
      SCW_API_URL: http://127.0.0.1:4599
      SCW_INSECURE: "true"

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.4

      - run: terraform init
      - run: terraform apply -auto-approve

      # What makes this a test rather than a demonstration: a second plan must
      # be empty. That is where an emulator answering 200 while storing something
      # else shows up, and it is the assertion this project's own conformance
      # suite runs against every provider.
      - run: terraform plan -detailed-exitcode

      - run: terraform destroy -auto-approve
