# Test a Terraform configuration against Scaleway, Outscale or Exoscale in
# GitLab CI — with no cloud account, no credentials and nothing billed.
#
# Copy this file into a repository holding a Terraform configuration, point the
# provider at $FEINT_ENDPOINT, and the pipeline runs. Nothing else is needed:
# there is no secret to create, because there is no account to authenticate to.
#
# The emulator runs as a service, which is what the OCI image exists for. It is
# control-plane only — `--vm off` — so it emulates the three APIs and starts no
# machines. Real machines behind `--vm` need the binary on a host with Incus, and
# docs/limits.md says why an image that promised otherwise would be a half-truth.
#
# The tag is a release's own and there is no `latest`, deliberately: a mutable
# reference pulls whatever is newest, which is an image nobody can name after the
# fact. Change it when you upgrade, on purpose.

variables:
  FEINT_IMAGE: ghcr.io/stephrobert/feint:v0.12.0
  # The service is reachable by its alias inside the job's network, and the
  # emulator's own port is the same one it uses everywhere else.
  FEINT_ENDPOINT: http://feint:4599

  # Well-formed and meaningless, which is the point: the emulator parses the
  # shape of a credential and verifies nothing. The Scaleway SDK does validate
  # the *format* — the access key looks like SCWXXXXXXXXXXXXXXXXX and the secret
  # is a UUID — so these are fake in the only way that still lets a real client
  # start.
  SCW_ACCESS_KEY: SCWXXXXXXXXXXXXXXXXX
  SCW_SECRET_KEY: 11111111-1111-1111-1111-111111111111
  SCW_DEFAULT_PROJECT_ID: 11111111-1111-1111-1111-111111111111
  SCW_DEFAULT_ORGANIZATION_ID: 11111111-1111-1111-1111-111111111111
  SCW_DEFAULT_ZONE: fr-par-1
  SCW_DEFAULT_REGION: fr-par
  SCW_API_URL: http://feint:4599
  SCW_INSECURE: "true"

terraform:
  image: hashicorp/terraform:1.15
  services:
    - name: $FEINT_IMAGE
      alias: feint
  before_script:
    # The image carries its own healthcheck, and GitLab does not wait for it, so
    # the job does. `wget` rather than `curl` because the Terraform image has it;
    # a fixed sleep is the version of this that passes on a fast runner and fails
    # on a slow one.
    - |
      for _ in $(seq 1 60); do
        wget -q -O /dev/null "$FEINT_ENDPOINT/_feint/health" && break
        sleep 1
      done
      wget -q -O - "$FEINT_ENDPOINT/_feint/health" || { echo "the emulator never answered"; exit 1; }
  script:
    - terraform init
    - terraform apply -auto-approve
    # The assertion that makes this a test rather than a demonstration: a second
    # plan must be empty. It is where an emulator that answers 200 and stores
    # something else shows up, and it is the check this project's own conformance
    # suite runs against every provider.
    - terraform plan -detailed-exitcode
    - terraform destroy -auto-approve
