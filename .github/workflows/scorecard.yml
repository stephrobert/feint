name: Scorecard

# OpenSSF Scorecard: an outside-in audit of the repository's supply-chain posture (branch
# protection, pinned actions, signed releases, dangerous workflow patterns). Published to the code
# scanning tab so a regression shows up as an alert rather than as a number nobody reads.

on:
  branch_protection_rule:
  schedule:
    - cron: '31 5 * * 3'
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    # Measured: 60 s at most, median 45 s, 20 runs from 2026-11-14 to 2026-11-16.
    # Three times the longest, rounded up to five minutes (#988).
    timeout-minutes: 5
    # The privileged token lives in this protected environment, restricted to
    # main. This workflow never runs on `pull_request`, so the secret is
    # unreachable from a fork — which is the only way a token with
    # Administration rights can be kept on a public repository.
    environment: Prod
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          # Blocked to the hosts this job was measured reaching on 2026-11-16:
          # every `domain resolved` line harden-runner logged in its last three
          # green runs (43923897925, 43904734656, 43901268330).
          # Variable hosts are one wildcard per family. Left out on purpose:
          # harden-runner's own endpoint, which its agent allows, and
          # api.snapcraft.io, snapd on the runner image, never called by a step.
          # Block narrows what this job reaches; it does not stop a decided leak:
          # docs/limits.md, "The CI's egress block narrows the surface" (#988).
          egress-policy: block
          allowed-endpoints: >
            api.deps.dev:443
            api.github.com:443
            api.osv.dev:443
            api.scorecard.dev:443
            codeload.github.com:443
            fulcio.sigstore.dev:443
            github.com:443
            hosted-compute-*.githubapp.com:443
            oss-fuzz-build-logs.storage.googleapis.com:443
            rekor.sigstore.dev:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            www.bestpractices.dev:443
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # Branch-Protection cannot be evaluated with the default token when a
          # repository uses *classic* protection: the check returns -1, an
          # internal error that is silently dropped from the average rather than
          # scored. A fine-grained PAT with `Administration: Read` is what
          # Scorecard documents for that case.
          #
          # This repository protects main with a **ruleset**
          # (.github/rulesets/main.json), which the default GITHUB_TOKEN can
          # already read — so this token is belt and braces rather than a
          # requirement, and the workflow keeps working if the secret is ever
          # removed. It is scoped read-only and reachable only from the
          # protected `security` environment above.

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
