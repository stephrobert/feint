# The commit subjects of a pull request, checked by the same tool the local hook
# runs.
#
# It exists because the local hook cannot be relied on. Git hooks live in
# .git/hooks/, which no clone carries, so `pre-commit install` is a step a
# contributor can skip and `--no-verify` is one keystroke. Without this workflow,
# Conventional Commits would be a convention held by whoever happens to have the
# hook installed.
#
# It is not cosmetic. `cz bump` derives the next version from these subjects:
# feat moves the minor, fix the patch, a `!` marks the break. A subject that does
# not parse is a release that computes the wrong number, and the number is what
# users pin.
name: Commits

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventional:
    name: Conventional Commits
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      # The whole range has to be reachable: cz checks base..head, and a shallow
      # clone would hand it a range git cannot resolve.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install commitizen (pinned, same version as the hook)
        run: pip install --no-cache-dir --require-hashes -r tools/ci/commitizen-requirements.txt

      # The range, not the working tree: this says nothing about the files and
      # everything about the messages the branch adds.
      - name: Check the subjects this branch adds
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: cz check --rev-range "${BASE_SHA}..${HEAD_SHA}"
