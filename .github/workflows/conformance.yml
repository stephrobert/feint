name: Conformance

# Proof by the real clients, not by our own assertions.
#
# Unit tests check what we believe the API does. This workflow starts the emulator and points the
# official Scaleway CLI and the official Terraform provider at it. If they parse our answers, the
# wire format is right; if they do not, the emulator is wrong no matter what the unit tests say.
#
# Runs on every pull request (fast) and nightly (with the whole matrix), so a provider release that
# changes what it expects from the API surfaces within a day.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:

permissions: {}

# One pin per client two jobs install: the matrix legs and the image job read
# these, so the version that proves the binary and the version that proves the
# image cannot quietly diverge. The other clients stay pinned in their own
# install steps, where each has exactly one.
env:
  SCW_VERSION: '2.56.3'
  TERRAFORM_VERSION: '1.13.3'

jobs:
  # The page, driven by the one client that can say whether it renders: a
  # headless browser. It is a job of its own rather than a leg of the matrix
  # below, because it starts its own emulator on its own port and drives it with
  # its own sequence of calls.
  #
  # It runs on every pull request, which is the point: four Go tests hold the
  # asset as text and none of them executes a line of its JavaScript, so this is
  # the only thing between a renamed node and a blank region shipped green.
  # docs/limits.md says exactly what it covers and what it does not.
  page:
    name: page
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: false

      # No browser is installed here: the runner image ships Google Chrome, and
      # the script finds it by name. If it ever stops shipping one the script
      # exits 3 and this job fails, which is deliberate — a check that skips is a
      # check that measures nothing, and this repository already shipped one of
      # those in its network suite.
      - name: Check the page in a browser
        run: tools/ui/screenshots.sh --check

  # The same proof as the matrix below, against the emulator running inside the
  # container image instead of a host process. This is what the roadmap's image
  # item names as its evidence: an image that merely starts proves nothing, so
  # the official CLI, the contract probe and the example stacks drive it from
  # the host, through the published port, exactly the way a `services:` block
  # would reach it.
  #
  # It runs on every pull request rather than only at release, because release
  # is the one moment a broken Dockerfile cannot be cheaply fixed: the tag is
  # pushed, the workflow fails, and the release exists half-published.
  image:
    name: image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: false

      # The same build the release performs (static, trimmed), because the
      # image copies a prebuilt binary rather than compiling one: the bytes in
      # a released image are the bytes in the release, and this job must build
      # them the same way to prove the same thing.
      - name: Build the binary and the image
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/feint-linux-amd64 ./cmd/feint
          docker build -t feint:conformance .

      # Default command, no override: what a `services:` block runs is the
      # image as shipped, and a proof that quietly passes different flags
      # proves a different image.
      - name: Start the container
        run: |
          docker run -d --name feint -p 127.0.0.1:4599:4599 feint:conformance
          dist/feint-linux-amd64 wait --addr 127.0.0.1:4599 --timeout 30s

      # Same pinned version (the workflow-level SCW_VERSION), same upstream
      # checksums as the scw-cli leg of the matrix: one client, two emulator
      # packagings, one truth.
      - name: Install the Scaleway CLI
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          base="https://github.com/scaleway/scaleway-cli/releases/download/v${SCW_VERSION}"
          asset="scaleway-cli_${SCW_VERSION}_linux_amd64"
          curl --retry 3 --retry-connrefused -fsSL -o "${workdir}/${asset}" "${base}/${asset}"
          curl --retry 3 --retry-connrefused -fsSL -o "${workdir}/sums" "${base}/SHA256SUMS"
          (cd "${workdir}" && grep " ${asset}$" sums | sha256sum -c -)
          sudo install -m 0755 "${workdir}/${asset}" /usr/local/bin/scw
          scw version

      - name: Run the CLI conformance suite against the image
        run: tools/conformance/scaleway/scw-cli.sh http://127.0.0.1:4599

      # Contract checking happens on the host side — the probe reads the
      # committed contracts and validates every answer the container gives —
      # so the image stays what a user pulls: no contracts directory inside,
      # no flag a `services:` block would not pass.
      - name: Probe every route of the image against its contract
        run: dist/feint-linux-amd64 probe --endpoint http://127.0.0.1:4599 --contracts contracts

      # Same pinned version as the terraform leg of the matrix (the
      # workflow-level TERRAFORM_VERSION), same upstream checksums: one client,
      # two emulator packagings, one truth — the argument that already holds
      # for scw above.
      - name: Install Terraform
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          base="https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}"
          asset="terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl --retry 3 --retry-connrefused -fsSL -o "${workdir}/${asset}" "${base}/${asset}"
          curl --retry 3 --retry-connrefused -fsSL -o "${workdir}/sums" "${base}/terraform_${TERRAFORM_VERSION}_SHA256SUMS"
          (cd "${workdir}" && grep " ${asset}$" sums | sha256sum -c -)
          sudo unzip -o "${workdir}/${asset}" terraform -d /usr/local/bin
          terraform version

      # The example stacks against the image, not only against a host binary.
      #
      # #251 asks for them "against the published image", and a pull request is
      # the one place that cannot literally mean the last tag on ghcr.io: a
      # published image is immutable, and the stacks grow whenever they find a
      # defect, so the two diverge every time the stacks do their job. Measured,
      # not argued: v0.8.0 was published on 2026-08-14, the fixes for #249 and
      # #250 landed on 2026-08-17, and both stacks exercise exactly those fixes
      # — a gate on the published tag would have been red by construction from
      # its first run. What a pull request can prove is the image as it will be
      # published, built above from the release's own recipe, and the push run
      # on main proves the exact commit a tag is later cut from. That chain is
      # what makes the image a user eventually pulls a proven one.
      - name: Apply the example stacks against the image
        run: tools/conformance/stacks.sh http://127.0.0.1:4599

      - name: The container's log
        if: failure()
        run: docker logs feint 2>&1 | tail -100 || true

      - name: Stop the container
        if: always()
        run: docker rm -f feint || true

  clients:
    name: ${{ matrix.client }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # `fields` is not a client: it is the leg that drives every one of
        # them against a single emulator, which is what the omission gate
        # (#88) needs to mean anything. Its verdict is that *no answer of
        # this run* carried a declared field, and every other leg here is a
        # partial run by construction — the terraform leg drives no
        # octl, so ReadVms carries no UserData and the gate would blame
        # the emulator for the shape of the leg. Only this one sets
        # FEINT_FIELD_GATE.
        client: [scw-cli, terraform, opentofu, octl, exo-cli, probe, fields]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          # No go.sum to key a cache on: the zero-dependency rule keeps this module
          # dependency-free, and a pre-commit hook fails if the file ever
          # appears. Pointing the cache at it warned on every run and never
          # hit, which is a cache that costs and returns nothing.
          cache: false

      # --contracts turns on the response check: every answer a client provokes
      # is validated against the provider's own API description, so an invented
      # field fails the run rather than waiting for somebody to notice.
      # `start` detaches, records the instance and waits for it to answer, which
      # is what the `&` plus a forty-iteration curl loop was doing by hand — and
      # doing worse: that loop could not tell "still starting" from "exited at
      # once", so a bad flag produced ten seconds of silence and then a timeout
      # instead of the child's actual error.
      #
      # A step that backgrounds a process survives into the following steps of
      # the same job, which is what this relies on; `stop` in the always() step
      # below is what keeps it from outliving the job.
      - name: Build and start the emulator
        run: |
          go build -o /tmp/feint ./cmd/feint
          # --projects declares the same catalogue tools/conformance/leg.sh and the
          # `conformance` mise task declare (#572). Named here as well because
          # this workflow starts its OWN emulator, one per matrix leg: the first
          # version of #572 taught the two of them and left this one, and five
          # jobs went red at 44 s with "the declared project did not list under
          # its own name: []". Held by TestEveryConformanceEmulatorDeclaresTheSameProjects.
          /tmp/feint start --addr 127.0.0.1:4599 --contracts contracts \
            --projects default,platform-prod --timeout 60s
          # The doorway step of the Outscale Terraform suite evals the real
          # output of `feint env` rather than restating it, so the script needs
          # the binary this job just built — the repo-root default it falls
          # back to only exists where `mise run build` ran (#286).
          echo "FEINT_BIN=/tmp/feint" >> "$GITHUB_ENV"

      # Every client below is verified before it runs, and the reason is what
      # this repository is: a conformance suite is a machine that downloads four
      # third-party binaries and gives them a shell. A swapped asset there would
      # be executed on every push, on a runner holding the token that can write
      # releases. Verified is the only acceptable default.
      #
      # Scaleway publishes SHA256SUMS beside its binaries, so the sums come from
      # upstream rather than from this file.
      - name: Install the Scaleway CLI
        if: matrix.client == 'scw-cli' || matrix.client == 'fields'
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          base="https://github.com/scaleway/scaleway-cli/releases/download/v${SCW_VERSION}"
          asset="scaleway-cli_${SCW_VERSION}_linux_amd64"
          curl --retry 3 --retry-connrefused -fsSL -o "${workdir}/${asset}" "${base}/${asset}"
          curl --retry 3 --retry-connrefused -fsSL -o "${workdir}/sums" "${base}/SHA256SUMS"
          (cd "${workdir}" && grep " ${asset}$" sums | sha256sum -c -)
          sudo install -m 0755 "${workdir}/${asset}" /usr/local/bin/scw
          scw version

      - name: Run the CLI conformance suite
        if: matrix.client == 'scw-cli' || matrix.client == 'fields'
        run: tools/conformance/scaleway/scw-cli.sh http://127.0.0.1:4599

      # octl replaced oapi-cli here on 2026-08-25 (#460), and the reason is not
      # taste: `outscale/oapi-cli` and `outscale/osc-cli` are both archived on
      # the GitHub API, with "Deprecated Outscale CLI" in their own description,
      # so the suite was proving the emulator against something Outscale no
      # longer ships. It also buys back the AppImage dance this step used to
      # need — FUSE, an extraction, an APPDIR wrapper — and a stronger check:
      # octl publishes a checksums file with its release, so the sum comes from
      # upstream instead of being a digest pinned here by hand.
      - name: Install the Outscale CLI
        if: matrix.client == 'octl' || matrix.client == 'fields'
        env:
          OCTL_VERSION: 'v0.0.31'
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          version="${OCTL_VERSION#v}"
          base="https://github.com/outscale/octl/releases/download/${OCTL_VERSION}"
          asset="octl_Linux_x86_64"
          curl --retry 3 --retry-connrefused -fsSL -o "${workdir}/${asset}" "${base}/${asset}"
          curl --retry 3 --retry-connrefused -fsSL -o "${workdir}/sums" \
            "${base}/octl_${version}_checksums.txt"
          (cd "${workdir}" && grep " ${asset}$" sums | sha256sum -c -)
          sudo install -m 0755 "${workdir}/${asset}" /usr/local/bin/octl
          octl --version

      - name: Run the Outscale CLI conformance suite
        if: matrix.client == 'octl' || matrix.client == 'fields'
        run: tools/conformance/outscale/octl.sh http://127.0.0.1:4599

      # The Exoscale CLI cannot be redirected by a flag or an environment
      # variable — only by the `endpoint` key of its own configuration file, and
      # that value must carry the /v2 suffix. Both facts were measured with a
      # logging proxy; neither is documented. The suite writes that file itself.
      - name: Install the Exoscale CLI
        if: matrix.client == 'exo-cli' || matrix.client == 'fields'
        env:
          EXO_VERSION: 'v1.95.6'
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          version="${EXO_VERSION#v}"
          base="https://github.com/exoscale/cli/releases/download/${EXO_VERSION}"
          asset="exoscale-cli_${version}_linux_amd64.tar.gz"
          curl --retry 3 --retry-connrefused -fsSL -o "${workdir}/${asset}" "${base}/${asset}"
          curl --retry 3 --retry-connrefused -fsSL -o "${workdir}/sums" "${base}/exoscale-cli_${version}_checksums.txt"
          (cd "${workdir}" && grep " ${asset}$" sums | sha256sum -c -)
          tar -xzf "${workdir}/${asset}" -C "${workdir}" exo
          sudo install -m 0755 "${workdir}/exo" /usr/local/bin/exo
          exo version

      - name: Run the Exoscale CLI conformance suite
        if: matrix.client == 'exo-cli' || matrix.client == 'fields'
        run: tools/conformance/exoscale/exo-cli.sh http://127.0.0.1:4599

      # The two-zone proof (#278): the same real CLI against a second emulator
      # this suite starts itself, configured for ch-gva-2 on its own port. Not
      # on the `fields` leg: the field gate judges the shared emulator's run,
      # and this suite's traffic goes to its own — adding it there would prove
      # nothing about that verdict.
      - name: Run the Exoscale two-zone suite
        if: matrix.client == 'exo-cli'
        run: FEINT_BIN=/tmp/feint tools/conformance/exoscale/zones.sh

      # The release zip and its checksum, verified before anything runs — not a
      # key piped from a URL into gpg. The apt route asked this job to trust a
      # transport for a key that then authorises every package from that
      # repository, which is a wider grant than "install one binary" needs, and
      # poutine's unverified_script_exec was right to say so.
      #
      # The version is pinned rather than floating: a conformance suite whose
      # client changes under it reports a difference nobody made.
      - name: Install Terraform
        if: matrix.client == 'terraform' || matrix.client == 'fields'
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          base="https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}"
          asset="terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl --retry 3 --retry-connrefused -fsSL -o "${workdir}/${asset}" "${base}/${asset}"
          curl --retry 3 --retry-connrefused -fsSL -o "${workdir}/sums" "${base}/terraform_${TERRAFORM_VERSION}_SHA256SUMS"
          (cd "${workdir}" && grep " ${asset}$" sums | sha256sum -c -)
          sudo unzip -o "${workdir}/${asset}" terraform -d /usr/local/bin
          terraform version

      # This step used to download install-opentofu.sh and run it with
      # --skip-verify, which is two separate grants: executing a script fetched
      # over the wire, and then telling it not to check what it installs. Both
      # were unnecessary — OpenTofu publishes SHA256SUMS with its releases.
      - name: Install OpenTofu
        if: matrix.client == 'opentofu'
        env:
          TOFU_VERSION: '1.12.5'
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          base="https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}"
          asset="tofu_${TOFU_VERSION}_linux_amd64.zip"
          curl --retry 3 --retry-connrefused -fsSL -o "${workdir}/${asset}" "${base}/${asset}"
          curl --retry 3 --retry-connrefused -fsSL -o "${workdir}/sums" "${base}/tofu_${TOFU_VERSION}_SHA256SUMS"
          (cd "${workdir}" && grep " ${asset}$" sums | sha256sum -c -)
          sudo unzip -o "${workdir}/${asset}" tofu -d /usr/local/bin
          tofu version
          # The fixture script calls `terraform`; OpenTofu is a drop-in for this purpose.
          sudo ln -sf /usr/local/bin/tofu /usr/local/bin/terraform

      # Both providers that have a Terraform fixture, not one.
      #
      # This ran the Scaleway fixture alone, while the status table said Outscale
      # was proven by Terraform too. The table was not wrong — the fixture exists,
      # applies seventeen resources and passes — but it was proven only where a
      # human runs `mise run conformance`, so a regression in it would reach a
      # release without a single red check. The same shape as the `--vm` claims
      # fixed in #147: a real proof, narrower in reach than the sentence
      # describing it.
      #
      # Reported by a reader comparing the README with the workflow, which is the
      # only way this is ever found.
      - name: Run the Terraform conformance suite — Scaleway
        if: matrix.client == 'terraform' || matrix.client == 'opentofu' || matrix.client == 'fields'
        run: tools/conformance/scaleway/terraform.sh http://127.0.0.1:4599

      - name: Run the Terraform conformance suite — Outscale
        if: matrix.client == 'terraform' || matrix.client == 'opentofu' || matrix.client == 'fields'
        run: tools/conformance/outscale/terraform.sh http://127.0.0.1:4599

      # The example stacks, which are examples and tests at once. They are
      # written the way a platform team writes Terraform rather than the way a
      # fixture is written, and that difference is measured rather than claimed:
      # within an hour of the first one being applied, two defects surfaced that
      # every gate here was blind to — a route that could not point at a Net
      # peering (#249), and a tagged NIC that read back without its tags (#250).
      #
      # They run on the terraform and opentofu legs rather than on `fields`: the
      # omission gate's verdict is about a whole run, and a stack applying a
      # thousand resources tells it nothing a suite does not.
      - name: Apply the example stacks
        if: matrix.client == 'terraform' || matrix.client == 'opentofu'
        run: tools/conformance/stacks.sh http://127.0.0.1:4599

      # The README's own four commands (#593): `feint up` on
      # examples/quickstart, an empty second plan, `feint down`. The example a
      # reader copies first is the one whose breakage they meet first, and it
      # had no gate at all — a quickstart nobody runs is a README that rots.
      #
      # On the terraform and opentofu legs for the reason the stacks are, and
      # on an emulator and a port of its own for the reason the environment
      # suite has one: `feint up` and `feint down` are what it drives, so
      # pointed at the shared address its cleanup would stop the emulator this
      # job's other steps are measuring.
      - name: Run the quick start the way the README prints it
        if: matrix.client == 'terraform' || matrix.client == 'opentofu'
        run: tools/conformance/quickstart.sh 127.0.0.1:4597

      # Fault injection (#26, #356): the four real clients meeting a refusal.
      #
      # On `fields` because that is the only leg with scw, octl, exo and
      # Terraform installed at once, and this suite needs all four — a 403 has
      # to reach each client in its own dialect or the whole seam is unproven.
      # Its traffic goes to an emulator it starts itself, on its own port, so
      # the field gate this leg carries judges exactly what it judged before:
      # the shared emulator's run. That separation is not a convenience, it is
      # the point — score.sh below refuses any run carrying an injected answer,
      # and this suite is what would trip it.
      - name: Run the fault-injection suite
        if: matrix.client == 'fields'
        run: FEINT_BIN=/tmp/feint tools/conformance/faults.sh

      # The refusals a real cloud answered (#390), reissued from the committed
      # corpora. It needs no client binary, and it runs here rather than on
      # every leg because this is the leg whose emulator the evidence record is
      # read from. It shares that emulator, which the suite above deliberately
      # does not: a corpus of 4xx mutates nothing, and `feint replay
      # --refusals-only` reads each file whole before sending anything instead
      # of taking that on trust.
      - name: Replay the recorded refusals
        if: matrix.client == 'fields'
        run: FEINT_BIN=/tmp/feint tools/conformance/refusals.sh http://127.0.0.1:4599

      # `feint up` and `feint down` on the fixture declaration (#190), with
      # --vm off, which is the whole of this matrix. It runs on `probe` because
      # that leg needs no client binary and this suite needs none either: what
      # it drives is the binary's own lifecycle. Its emulator is its own, on its
      # own port, for the reason the fault suite's is.
      - name: Bring a declared environment up and down
        if: matrix.client == 'probe'
        run: |
          go build -o /tmp/feint ./cmd/feint
          FEINT_BIN=/tmp/feint tools/conformance/environment/up.sh 127.0.0.1:4598

      # No client at all: every route driven from its provider's own API
      # description, which is the half of conformance that needs nothing
      # installed. It proves the protocol and never touches the score.
      - name: Probe every route against its contract
        if: matrix.client == 'probe'
        run: |
          go build -o /tmp/feint ./cmd/feint
          /tmp/feint probe --endpoint http://127.0.0.1:4599 --contracts contracts

      # On failure only: the log is the first thing a reader needs then, and the
      # last thing they want in a green run. A separate step with a native
      # condition rather than a ${{ }} expansion inside `run:` — this repository
      # forbids template-into-shell on principle, and the principle does not get
      # an exception for a value that happens to be safe today.
      - name: The emulator's log
        if: failure()
        run: /tmp/feint logs --addr 127.0.0.1:4599 -n 100 || true

      # What this client drove, and whether anything it drove broke the contract.
      # The score is per client here, so it reads lower than a local run of the
      # whole suite; the violations are what fail the job.
      #
      # Before the stop, and that ordering is the whole point: score.sh reads
      # /_feint/conformance from the running emulator and exits 1 when nothing
      # answers. Stopping first failed this step, and with it every leg of the
      # matrix, on runs that were otherwise green.
      #
      # FEINT_FIELD_GATE on the `fields` leg only, because only that leg drove
      # every client against this emulator. Everywhere else score.sh still
      # prints what the omission check found and judges none of it: an absent
      # field on a partial run says nothing about the emulator. An undeclared
      # whole run counts as partial, the way an undeclared driver capability
      # counts as absent.
      - name: Report what was exercised
        if: always()
        env:
          FEINT_FIELD_GATE: ${{ matrix.client == 'fields' && '1' || '0' }}
        run: tools/conformance/score.sh http://127.0.0.1:4599

      # Always: a job that leaves the emulator running leaves a process holding a
      # port on a runner about to be reused.
      - name: Stop the emulator
        if: always()
        run: /tmp/feint stop --addr 127.0.0.1:4599 || true

      - name: Dump the emulator state on failure
        if: failure()
        run: |
          curl -s http://127.0.0.1:4599/_feint/health || true
          curl -s http://127.0.0.1:4599/_feint/routes || true
