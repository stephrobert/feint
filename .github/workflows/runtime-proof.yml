# The runtime-backed proof, on a machine nobody here owns (#125).
#
# Every network, firewall and ssh measurement in docs/limits.md was taken on the
# author's station. This workflow takes the same measurements on a GitHub-hosted
# runner: Incus from the Zabbly stable channel (Ubuntu 24.04 ships 6.0.0, which
# rejects security.acls on a bridged NIC — the distro package would prove less
# than it appears to), OVN from the Ubuntu archive, and the emulator's own
# conformance suites driven by the official clients.
#
# Two legs, because the modes are not equivalent and the code must say so:
#   incus      bridged containers — machines, addresses and firewalls, no
#              isolation between VPCs (two managed bridges on one host route
#              to each other; docs/limits.md measures it)
#   incus-ovn  the same plus OVN — subnets isolated by construction, and the
#              cross-VPC assertion hard-fails instead of skipping
# The verdict keys on `capabilities.isolation` from /_feint/health, never on a
# mode name: a suite that compares mode strings has to be edited every time a
# driver gains a capability, and it lies the day a mode stops delivering one.
#
# Not on pull_request, and that is a rule this repository has already paid for:
# a harness fails more often than what it measures (five false verdicts in one
# day are on record), and a mandatory network suite that reds on runner weather
# gets disarmed, which is worse than not running. So: nightly plus dispatch.
# Promotion to pull_request is earned by measurement, not decided — it happens
# when 14 consecutive scheduled runs of this workflow are green, a number the
# Actions history proves. Until that streak exists, this workflow stays advisory
# and #125 stays open.
#
# That sentence was the whole of the measurement until the `streak` job below
# existed: a criterion nobody computed, waiting for somebody to think of opening
# the Actions history. It counts nights only — the first measurement it took
# returned 0, where a reader eyeballing the history had said 1 by counting a
# push-triggered run, and the push history also holds a failure and a
# cancellation. Counting every event would let the streak be earned by pressing
# a button.
#
# What this does not repeat: the client matrix of conformance.yml. The control
# plane is proven there on every pull request, with --vm off. This job proves
# the layer conformance.yml deliberately leaves out — the machine behind the
# answer — so it runs the network and ssh suites, which are exactly the scripts
# that skip themselves when no runtime is configured.
#
# A third job joined the two legs on 2026-08-28 (#504): `stacks`, which applies
# the example stacks to real machines. That widens the promotion criterion above
# rather than leaving it alone, and it is meant to: the streak is counted from
# this workflow's own conclusion, so a night whose stack gate went red is a
# night the runtime proof was red. Narrowing the criterion to exclude a gate
# because it might redden is how a criterion becomes decoration.
name: Runtime proof

on:
  schedule:
    # Nightly, offset from conformance.yml's 03:43 so the two never compete
    # for the same third-party release servers at the same minute.
    - cron: '31 2 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  runtime:
    name: ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    # Machine launches cost tens of seconds each and the ssh suites boot one
    # per provider. Generous, because a timeout that fires on a slow image
    # download is a red that measures the mirror, not the emulator.
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        mode: [incus, incus-ovn]
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          # No go.sum to key a cache on: the zero-dependency rule keeps this
          # module dependency-free.
          cache: false

      # The Zabbly stable channel, not the distro package, and the reason is in
      # docs/install.md: Ubuntu 24.04 ships Incus 6.0.0, below the 6.0.4 floor
      # where NIC ACLs start being accepted — a security group then attaches
      # and enforces nothing, which looks exactly like a bug in feint.
      #
      # The key is verified against a pinned fingerprint before apt trusts it.
      # docs/install.md shows the fingerprint to a human; a workflow has no
      # human, so the check is the comparison itself.
      - name: Install Incus (Zabbly stable, key fingerprint pinned)
        env:
          ZABBLY_FPR: '4EFC590696CB15B87C73A3AD82CC8797C838DCFD'
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          curl --retry 3 --retry-connrefused -fsSL https://pkgs.zabbly.com/key.asc -o "${workdir}/zabbly.asc"
          fpr="$(gpg --show-keys --with-colons "${workdir}/zabbly.asc" | awk -F: '/^fpr/ {print $10; exit}')"
          if [ "${fpr}" != "${ZABBLY_FPR}" ]; then
            echo "unexpected Zabbly key fingerprint: ${fpr}" >&2
            exit 1
          fi
          sudo install -D -m 0644 "${workdir}/zabbly.asc" /etc/apt/keyrings/zabbly.asc
          # shellcheck disable=SC1091
          codename="$(. /etc/os-release && echo "${VERSION_CODENAME}")"
          arch="$(dpkg --print-architecture)"
          sudo tee /etc/apt/sources.list.d/zabbly-incus.sources >/dev/null <<EOF
          Enabled: yes
          Types: deb
          URIs: https://pkgs.zabbly.com/incus/stable
          Suites: ${codename}
          Components: main
          Architectures: ${arch}
          Signed-By: /etc/apt/keyrings/zabbly.asc
          EOF
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends incus incus-client netcat-openbsd
          sudo incus --version

      # OVN and Open vSwitch from the Ubuntu archive — docs/install.md measures
      # that pairing (Zabbly Incus + distribution OVN) on four releases. The
      # kernel module is the part hosted runners are known to need help with:
      # ovn-org's own CI installs linux-modules-extra-$(uname -r) before its
      # system tests, so the fallback here is theirs.
      #
      # AppArmor is deliberately left alone. The ovn-org CI's aa-teardown is a
      # workaround for binaries built from source outside any packaged profile,
      # not a prerequisite; docs/install.md measures a packaged install running
      # the network suite with AppArmor enforcing 180 profiles.
      - name: Install and wire OVN
        if: matrix.mode == 'incus-ovn'
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends ovn-central ovn-host openvswitch-switch
          if ! sudo modprobe openvswitch; then
            sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)"
            sudo modprobe openvswitch
          fi
          sudo systemctl enable --now openvswitch-switch ovn-central ovn-host
          # The units return before the databases listen (docs/install.md).
          for _ in $(seq 1 30); do
            [ -S /run/ovn/ovnnb_db.sock ] && break
            sleep 1
          done
          if [ ! -S /run/ovn/ovnnb_db.sock ]; then
            echo 'ovnnb_db.sock never appeared' >&2
            sudo journalctl -u ovn-central --no-pager | tail -n 50 >&2
            exit 1
          fi
          sudo ovs-vsctl set open_vswitch . \
            external_ids:ovn-remote=unix:/run/ovn/ovnsb_db.sock \
            external_ids:ovn-encap-type=geneve \
            external_ids:ovn-encap-ip=127.0.0.1

      # feint creates its own uplink (feint-uplink, labelled, never a bridge it
      # did not make), so the only wiring Incus needs is where the northbound
      # database is.
      - name: Initialise Incus
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          sudo incus admin init --minimal
          if [ "${MODE}" = "incus-ovn" ]; then
            sudo incus config set network.ovn.northbound_connection unix:/run/ovn/ovnnb_db.sock
          fi

      # The runner image ships Docker, and Docker sets the host's iptables
      # FORWARD policy to DROP while enabling br_netfilter — so every packet
      # bridged or routed through the host between or for Incus containers
      # dies on a policy feint never wrote. Measured twice on run 31716252496,
      # once per leg. Leg `incus`: two machines of the same VPC could not
      # reach each other ("FAIL: 10.184.0.2 is unreachable within one VPC;
      # isolation is separating too much"), and a foreign VPC read as isolated
      # when a bridge cannot isolate. Leg `incus-ovn`: both network suites
      # passed — OVN's east-west traffic is geneve-encapsulated and never
      # crosses FORWARD — but the ssh suite died on "no ssh daemon answered",
      # because cloud-init installs openssh at boot and the machines' outbound
      # traffic is routed and NATed through the host, which does cross it.
      #
      # Opening the policy does not soften any assertion: the firewall checks
      # are enforced by Incus ACLs in Incus's own chains (they passed in that
      # same run, policy DROP and all), and the isolation verdict must come
      # from the runtime under test, not from a host policy that drops
      # everything for everyone.
      - name: Keep the runner's Docker firewall out of the verdict
        run: sudo iptables -P FORWARD ACCEPT

      # The diagnosis before the verdict: doctor names the missing piece when
      # the wiring above went wrong, which is cheaper to read than a suite
      # timing out forty minutes later.
      - name: Build feint and diagnose the runtime
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          go build -o feint ./cmd/feint
          sudo ./feint doctor --vm "${MODE}"

      # The images the machines boot, built before anything needs them (#335).
      #
      # This is not a convenience. Without them the driver falls back to an
      # upstream image, which carries no ssh daemon; and since #202 a machine
      # holds exactly the address its provider publishes, on a routed NIC with
      # no NAT, so cloud-init cannot install one either. The workflow was red
      # on the "Scaleway ssh suite" step for five consecutive scheduled nights
      # (2026-08-16 to 2026-08-20) for that reason alone, with `fix="feint
      # images"` printed in its own log every night and nothing reading it.
      #
      # The step is half the fix. The other half is in
      # tools/conformance/guard.sh: the ssh suites now refuse to start when the
      # images are missing, so deleting this step fails at the doorstep with the
      # command to run, instead of ninety seconds later on an ssh timeout that
      # blames the network.
      # The build container must reach a package repository before anything
      # spends a minute finding out that it cannot (#583).
      #
      # On the night of 2026-08-28 both legs died here, on every image:
      #
      #   apk add --no-cache openssh in the build instance:
      #     fetching https://dl-cdn.alpinelinux.org/alpine/v3.21/main: Permission denied
      #
      # `Permission denied` on a connect() is EACCES — what an nftables or
      # iptables REJECT answers, not what a missing route (Network unreachable)
      # or a CDN refusal (403) answers. Nothing on this side moved: the action is
      # pinned by SHA, egress-policy is `audit`, and the Alpine CDN answered 200
      # in 0.121 s from the maintainer's station the same morning. What moved is
      # the runner image, from 20260729.566 on the last night that cleared this
      # step to 20260819.586 on the night that did not.
      #
      # Both Docker and Incus manage that filter on a hosted runner: Docker sets
      # a FORWARD DROP policy, Incus adds accept rules for its own bridge. An
      # image that changes either one's version, or the order they are applied,
      # takes egress away from containers in exactly this shape.
      #
      # So this step measures first and repairs second, and then **proves the
      # repair before the build depends on it**: a throwaway container fetches
      # one real URL. A prerequisite asserted rather than demonstrated is the
      # defect this repository spends its time removing, and an image build that
      # discovers a dead network a minute in reports the wrong thing — the night
      # of the 28th surfaced `the emulator did not answer /_feint/conformance`,
      # which was true and thirty milliseconds too late to be useful.
      - name: The build container reaches the network, or this step says why
        run: |
          set -euo pipefail

          echo "== what the filter looks like before anything"
          sudo iptables -S FORWARD 2>&1 | head -20 || true
          sudo iptables -t nat -S POSTROUTING 2>&1 | head -10 || true
          docker --version 2>&1 || true
          sudo incus --version 2>&1 || true

          bridge="$(sudo incus network list --format csv \
            | awk -F, '$2=="bridge" && $1 ~ /^incusbr/ {print $1; exit}')"
          echo "== bridge: ${bridge:-none found}"

          if [ -n "${bridge}" ]; then
            # Insert rather than append: Docker's DROP policy and its own chains
            # are already there, and a rule appended after a DROP never runs.
            sudo iptables -I FORWARD -i "${bridge}" -j ACCEPT
            sudo iptables -I FORWARD -o "${bridge}" -j ACCEPT
            echo "== accept rules inserted for ${bridge}"
          fi

          # The positive control. A throwaway container, one real fetch, and a
          # refusal that names what it could not reach — never a silent pass.
          probe=rp-egress-probe
          sudo incus delete --force "${probe}" >/dev/null 2>&1 || true
          sudo incus launch images:alpine/3.21/cloud "${probe}" >/dev/null
          trap 'sudo incus delete --force "${probe}" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 20); do
            if sudo incus exec "${probe}" -- ip -4 -o addr show scope global \
              | grep -q .; then break; fi
            sleep 1
          done
          echo "== the probe carries: $(sudo incus exec "${probe}" -- ip -4 -o addr show scope global | awk '{print $4}' | tr '\n' ' ')"
          if ! sudo incus exec "${probe}" -- wget -q -O /dev/null -T 20 \
            https://dl-cdn.alpinelinux.org/alpine/v3.21/main/x86_64/APKINDEX.tar.gz; then
            echo "FAIL: a container on ${bridge:-no bridge} cannot reach the Alpine CDN," >&2
            echo "      so every image build below would fail on apk with the runner's" >&2
            echo "      filter, not with anything this repository controls (#583)." >&2
            sudo iptables -S FORWARD 2>&1 | head -20 >&2 || true
            exit 1
          fi
          echo "== a container reaches the Alpine CDN"

      - name: Build the machine images the suites boot
        env:
          MODE: ${{ matrix.mode }}
        run: sudo ./feint images --vm "${MODE}"

      # The same verified installs as conformance.yml, because the ssh and
      # network suites drive the official clients, not curl.
      - name: Install the Scaleway CLI
        env:
          SCW_VERSION: '2.56.3'
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          base="https://github.com/scaleway/scaleway-cli/releases/download/v${SCW_VERSION}"
          asset="scaleway-cli_${SCW_VERSION}_linux_amd64"
          curl --retry 3 --retry-connrefused -fsSL -o "${workdir}/${asset}" "${base}/${asset}"
          curl --retry 3 --retry-connrefused -fsSL -o "${workdir}/sums" "${base}/SHA256SUMS"
          (cd "${workdir}" && grep " ${asset}$" sums | sha256sum -c -)
          sudo install -m 0755 "${workdir}/${asset}" /usr/local/bin/scw
          scw version

      # octl since #460: outscale/oapi-cli is archived and read-only upstream, and
      # octl publishes a checksums file, so the sum comes from upstream instead
      # of a digest pinned here. Same pin and same recipe as conformance.yml.
      - name: Install the Outscale CLI
        env:
          OCTL_VERSION: 'v0.0.31'
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          version="${OCTL_VERSION#v}"
          base="https://github.com/outscale/octl/releases/download/${OCTL_VERSION}"
          asset="octl_Linux_x86_64"
          curl --retry 3 --retry-connrefused -fsSL -o "${workdir}/${asset}" "${base}/${asset}"
          curl --retry 3 --retry-connrefused -fsSL -o "${workdir}/sums" \
            "${base}/octl_${version}_checksums.txt"
          (cd "${workdir}" && grep " ${asset}$" sums | sha256sum -c -)
          sudo install -m 0755 "${workdir}/${asset}" /usr/local/bin/octl
          octl --version

      - name: Install the Exoscale CLI
        env:
          EXO_VERSION: 'v1.95.6'
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          version="${EXO_VERSION#v}"
          base="https://github.com/exoscale/cli/releases/download/${EXO_VERSION}"
          asset="exoscale-cli_${version}_linux_amd64.tar.gz"
          curl --retry 3 --retry-connrefused -fsSL -o "${workdir}/${asset}" "${base}/${asset}"
          curl --retry 3 --retry-connrefused -fsSL -o "${workdir}/sums" "${base}/exoscale-cli_${version}_checksums.txt"
          (cd "${workdir}" && grep " ${asset}$" sums | sha256sum -c -)
          tar -xzf "${workdir}/${asset}" -C "${workdir}" exo
          sudo install -m 0755 "${workdir}/exo" /usr/local/bin/exo
          exo version

      # Root, because the Incus socket belongs to root:incus-admin and a group
      # granted mid-job does not reach the runner agent's already-running
      # session. The suites shell out to `incus` themselves to verify what the
      # machines really carry, so they run under the same identity.
      - name: Start the emulator with real machines
        env:
          MODE: ${{ matrix.mode }}
        run: sudo ./feint start --addr 127.0.0.1:4599 --vm "${MODE}" --contracts contracts --timeout 120s

      # The declaration the verdict keys on. In the OVN leg, isolation must be
      # declared: without this assertion, a silently degraded runtime would let
      # the cross-VPC check skip, and a proof that skips proves nothing — that
      # is how #116 shipped under a green run.
      - name: The runtime the health endpoint declares
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          health="$(curl -sf http://127.0.0.1:4599/_feint/health)"
          printf '%s\n' "${health}" | jq .
          machines="$(printf '%s' "${health}" | jq -r '.machines')"
          if [ "${machines}" = "none" ] || [ "${machines}" = "null" ]; then
            echo "no machine runtime behind --vm ${MODE}" >&2
            exit 1
          fi
          if [ "${MODE}" = "incus-ovn" ]; then
            isolation="$(printf '%s' "${health}" | jq -r '.capabilities.isolation')"
            if [ "${isolation}" != "true" ]; then
              echo 'OVN mode without declared isolation: the cross-VPC assertion would skip instead of proving' >&2
              exit 1
            fi
          fi

      # The measurements themselves: the block a client asks for is the block
      # it gets, the address the API publishes is the address the machine
      # carries, the firewall filters for real, and — under OVN — another
      # VPC's machine is unreachable, hard-failing if it is not.
      - name: Scaleway network suite
        run: sudo tools/conformance/scaleway/network.sh http://127.0.0.1:4599

      - name: Outscale network suite
        run: sudo tools/conformance/outscale/network.sh http://127.0.0.1:4599

      # The third one, and its absence is half of why #574 lived as long as it
      # did. Two of the three network suites ran here and the Exoscale one ran
      # nowhere: no leg, bridge or OVN, replayed it, local work happens under
      # OVN where the defect was masked by rule ordering (#491), and the only
      # routine that replayed it under the bridge was `evidence:update`'s
      # second leg, which nobody had run since a344f8d. A suite no matrix
      # carries is a suite whose verdict is a year old.
      #
      # On both legs, deliberately: the bridge is the poorer population here —
      # it is where a rule set wrongly bound to a private NIC actually bites —
      # and this repository's own rule is that a verdict about "this run" is
      # tried on the poorest run that triggers it.
      - name: Exoscale network suite
        run: sudo tools/conformance/exoscale/network.sh http://127.0.0.1:4599

      # The end of the chain the emulator exists for: a key registered through
      # the API, a server booted by the official client, a real shell on the
      # provider's own default login — three providers, three logins.
      - name: Scaleway ssh suite
        run: sudo tools/conformance/scaleway/ssh.sh http://127.0.0.1:4599

      - name: Outscale ssh suite
        run: sudo tools/conformance/outscale/ssh.sh http://127.0.0.1:4599

      - name: Exoscale ssh suite
        run: sudo tools/conformance/exoscale/ssh.sh http://127.0.0.1:4599

      - name: Report what was exercised
        if: always()
        run: sudo tools/conformance/score.sh http://127.0.0.1:4599

      # On failure only: what the emulator saw, and what the runtime holds —
      # the two views whose disagreement is usually the diagnosis.
      - name: The emulator's log and the runtime's state
        if: failure()
        run: |
          sudo ./feint logs --addr 127.0.0.1:4599 -n 200 || true
          sudo incus list || true
          sudo incus network list || true

      - name: Stop the emulator
        if: always()
        run: sudo ./feint stop --addr 127.0.0.1:4599 || true

      # The dataplane witness gate (#486) needs Terraform: it applies the
      # example stacks through `feint up`. Same pinned version and upstream
      # checksums as conformance.yml's TERRAFORM_VERSION — one client, two
      # workflows, one truth.
      - name: Install Terraform
        if: matrix.mode == 'incus-ovn'
        env:
          TERRAFORM_VERSION: '1.13.3'
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          base="https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}"
          asset="terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl --retry 3 --retry-connrefused -fsSL -o "${workdir}/${asset}" "${base}/${asset}"
          curl --retry 3 --retry-connrefused -fsSL -o "${workdir}/sums" "${base}/terraform_${TERRAFORM_VERSION}_SHA256SUMS"
          (cd "${workdir}" && grep " ${asset}$" sums | sha256sum -c -)
          sudo unzip -o "${workdir}/${asset}" terraform -d /usr/local/bin
          terraform version

      # The dataplane witness gate (#486): the example stacks under
      # `feint up --runtime incus-ovn`, then the host read back with incus — a
      # `running` resource has a Running machine (#484), a claimed firewall
      # leaves rule sets on the machines (#475), a claimed balancer holds a
      # backend and a port (#483), and a pack that claims nothing is skipped by
      # name (#481). On this leg only, and after the main emulator stopped: the
      # gate brings one emulator per stack up on its own port, and it belongs
      # here — never on a leg without OVN, where it could not look — on the
      # same terms as the ssh suites above.
      - name: Dataplane witness gate
        if: matrix.mode == 'incus-ovn'
        run: sudo tools/conformance/witness.sh

      # The crash policy, proven by a kill (#135): SIGKILL a serving emulator
      # with a machine up, assert the leftovers survive labelled, assert the
      # restart names them without adopting them, assert `clean` leaves zero
      # labelled objects with the runtime queried directly. After the stop
      # above, deliberately: this suite runs `feint clean`, which sweeps every
      # labelled object on the host — including the main emulator's networks,
      # had it still been serving.
      - name: Crash proof — what survives a kill
        env:
          MODE: ${{ matrix.mode }}
        run: sudo env FEINT_VM="${MODE}" tools/conformance/crash.sh

  # The stack gate (#504): the only thing in this repository that applies the
  # example stacks against real machines, and until now nothing in CI played it.
  #
  # WHY IT EARNED A JOB, on the day it was wired. `conformance:functional` is
  # what surfaced the isolation-detach race — an ACL deleted while the daemon
  # resolved it at `incus start`, killing machines behind a green apply. Finding
  # it cost three pull requests (#577, #578 and the diagnosis before them) and
  # the defect was older than the whole range bisected. No leg above plays the
  # stacks, and `mise run conformance` skips the stack suites without a runtime,
  # so a defect that only appears when a real apply races a real accept had no
  # gate at all.
  #
  # WHY A PARALLEL JOB RATHER THAN A STEP ON THE incus-ovn LEG, which is the
  # decision this issue asked to be argued rather than assumed:
  #
  #   - A step there queues behind six suites that were red on four of the last
  #     seven scheduled nights (Scaleway ssh, 2026-08-22 to 08-25), and a step
  #     that is never reached is a gate that never runs — which is #504's whole
  #     complaint about `conformance:functional` itself.
  #   - It would also inherit that leg's host. Measured on this station on
  #     2026-08-28, reproducing the leg: the three ssh suites each exit 0 and
  #     each leave something standing — `scw-…` and `exo-…` rule sets no client
  #     can delete, `fnt-default` and `feint-uplink` no resource owns — and
  #     `feint stop` sweeps none of them. That is why the witness gate below
  #     failed at its own doorstep on the one night it has been reached since it
  #     landed — 2026-08-27, "this host still holds what an earlier run left",
  #     naming feint-uplink and fnt-default; the night after never got that far.
  #     A job of its own starts on a runner nothing has touched.
  #   - Three passes is half an hour. Added to that leg it would push a 45-minute
  #     job onto its own timeout, and a job that times out is a verdict nobody
  #     wrote.
  #
  # Its red is its own, and that is the point: "runtime-proof failed" is noise,
  # "the stack gate failed on outscale, platform-web-a is stopped" is a finding.
  #
  # WHY incus-ovn ALONE. The gate's own default is incus-ovn and one of its
  # families needs it: two networks nothing peers must not reach each other, and
  # a bridge cannot deliver that (docs/limits.md). Under a bridge the gate would
  # skip its own subject by name, which is honest and worth nothing nightly.
  #
  # The setup below repeats the incus-ovn leg's, deliberately and not silently:
  # extracting it while that leg is red would make any new red ambiguous between
  # the gate and the refactor. TestBothRuntimeJobsPinTheSameHost holds the two
  # copies to the same pins, so a drift between them fails `mise run check`
  # rather than a night three weeks later.
  stacks:
    name: stacks (incus-ovn)
    runs-on: ubuntu-24.04
    # Three passes of a gate measured at 295 s on the author's station, on a
    # runner with a quarter of its cores: sized so a slow pass is still a
    # verdict rather than a timeout, because a timeout measures the runner.
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: false

      - name: Install Incus (Zabbly stable, key fingerprint pinned)
        env:
          ZABBLY_FPR: '4EFC590696CB15B87C73A3AD82CC8797C838DCFD'
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          curl --retry 3 --retry-connrefused -fsSL https://pkgs.zabbly.com/key.asc -o "${workdir}/zabbly.asc"
          fpr="$(gpg --show-keys --with-colons "${workdir}/zabbly.asc" | awk -F: '/^fpr/ {print $10; exit}')"
          if [ "${fpr}" != "${ZABBLY_FPR}" ]; then
            echo "unexpected Zabbly key fingerprint: ${fpr}" >&2
            exit 1
          fi
          sudo install -D -m 0644 "${workdir}/zabbly.asc" /etc/apt/keyrings/zabbly.asc
          # shellcheck disable=SC1091
          codename="$(. /etc/os-release && echo "${VERSION_CODENAME}")"
          arch="$(dpkg --print-architecture)"
          sudo tee /etc/apt/sources.list.d/zabbly-incus.sources >/dev/null <<EOF
          Enabled: yes
          Types: deb
          URIs: https://pkgs.zabbly.com/incus/stable
          Suites: ${codename}
          Components: main
          Architectures: ${arch}
          Signed-By: /etc/apt/keyrings/zabbly.asc
          EOF
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends incus incus-client netcat-openbsd
          sudo incus --version

      - name: Install and wire OVN
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends ovn-central ovn-host openvswitch-switch
          if ! sudo modprobe openvswitch; then
            sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)"
            sudo modprobe openvswitch
          fi
          sudo systemctl enable --now openvswitch-switch ovn-central ovn-host
          # The units return before the databases listen (docs/install.md).
          for _ in $(seq 1 30); do
            [ -S /run/ovn/ovnnb_db.sock ] && break
            sleep 1
          done
          if [ ! -S /run/ovn/ovnnb_db.sock ]; then
            echo 'ovnnb_db.sock never appeared' >&2
            sudo journalctl -u ovn-central --no-pager | tail -n 50 >&2
            exit 1
          fi
          sudo ovs-vsctl set open_vswitch . \
            external_ids:ovn-remote=unix:/run/ovn/ovnsb_db.sock \
            external_ids:ovn-encap-type=geneve \
            external_ids:ovn-encap-ip=127.0.0.1

      - name: Initialise Incus
        run: |
          set -euo pipefail
          sudo incus admin init --minimal
          sudo incus config set network.ovn.northbound_connection unix:/run/ovn/ovnnb_db.sock

      # The same reason as the leg above: the runner image's Docker sets the
      # host FORWARD policy to DROP, and the stacks' machines are reached over
      # routed addresses.
      - name: Keep the runner's Docker firewall out of the verdict
        run: sudo iptables -P FORWARD ACCEPT

      - name: Build feint and diagnose the runtime
        run: |
          set -euo pipefail
          go build -o feint ./cmd/feint
          sudo ./feint doctor --vm incus-ovn

      # The gate refuses without them rather than booting an upstream image with
      # no ssh daemon, so this is the half that makes the refusal never fire.
      # The build container must reach a package repository before anything
      # spends a minute finding out that it cannot (#583).
      #
      # On the night of 2026-08-28 both legs died here, on every image:
      #
      #   apk add --no-cache openssh in the build instance:
      #     fetching https://dl-cdn.alpinelinux.org/alpine/v3.21/main: Permission denied
      #
      # `Permission denied` on a connect() is EACCES — what an nftables or
      # iptables REJECT answers, not what a missing route (Network unreachable)
      # or a CDN refusal (403) answers. Nothing on this side moved: the action is
      # pinned by SHA, egress-policy is `audit`, and the Alpine CDN answered 200
      # in 0.121 s from the maintainer's station the same morning. What moved is
      # the runner image, from 20260729.566 on the last night that cleared this
      # step to 20260819.586 on the night that did not.
      #
      # Both Docker and Incus manage that filter on a hosted runner: Docker sets
      # a FORWARD DROP policy, Incus adds accept rules for its own bridge. An
      # image that changes either one's version, or the order they are applied,
      # takes egress away from containers in exactly this shape.
      #
      # So this step measures first and repairs second, and then **proves the
      # repair before the build depends on it**: a throwaway container fetches
      # one real URL. A prerequisite asserted rather than demonstrated is the
      # defect this repository spends its time removing, and an image build that
      # discovers a dead network a minute in reports the wrong thing — the night
      # of the 28th surfaced `the emulator did not answer /_feint/conformance`,
      # which was true and thirty milliseconds too late to be useful.
      - name: The build container reaches the network, or this step says why
        run: |
          set -euo pipefail

          echo "== what the filter looks like before anything"
          sudo iptables -S FORWARD 2>&1 | head -20 || true
          sudo iptables -t nat -S POSTROUTING 2>&1 | head -10 || true
          docker --version 2>&1 || true
          sudo incus --version 2>&1 || true

          bridge="$(sudo incus network list --format csv \
            | awk -F, '$2=="bridge" && $1 ~ /^incusbr/ {print $1; exit}')"
          echo "== bridge: ${bridge:-none found}"

          if [ -n "${bridge}" ]; then
            # Insert rather than append: Docker's DROP policy and its own chains
            # are already there, and a rule appended after a DROP never runs.
            sudo iptables -I FORWARD -i "${bridge}" -j ACCEPT
            sudo iptables -I FORWARD -o "${bridge}" -j ACCEPT
            echo "== accept rules inserted for ${bridge}"
          fi

          # The positive control. A throwaway container, one real fetch, and a
          # refusal that names what it could not reach — never a silent pass.
          probe=rp-egress-probe-stacks
          sudo incus delete --force "${probe}" >/dev/null 2>&1 || true
          sudo incus launch images:alpine/3.21/cloud "${probe}" >/dev/null
          trap 'sudo incus delete --force "${probe}" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 20); do
            if sudo incus exec "${probe}" -- ip -4 -o addr show scope global \
              | grep -q .; then break; fi
            sleep 1
          done
          echo "== the probe carries: $(sudo incus exec "${probe}" -- ip -4 -o addr show scope global | awk '{print $4}' | tr '\n' ' ')"
          if ! sudo incus exec "${probe}" -- wget -q -O /dev/null -T 20 \
            https://dl-cdn.alpinelinux.org/alpine/v3.21/main/x86_64/APKINDEX.tar.gz; then
            echo "FAIL: a container on ${bridge:-no bridge} cannot reach the Alpine CDN," >&2
            echo "      so every image build below would fail on apk with the runner's" >&2
            echo "      filter, not with anything this repository controls (#583)." >&2
            sudo iptables -S FORWARD 2>&1 | head -20 >&2 || true
            exit 1
          fi
          echo "== a container reaches the Alpine CDN"

      - name: Build the machine images the stacks boot
        run: sudo ./feint images --vm incus-ovn

      # `feint up` drives Terraform, which is what applies both stacks. Same
      # pinned version and upstream checksums as conformance.yml — one client,
      # three workflows, one truth. No provider CLI is installed: this gate
      # speaks curl and jq to the emulator and reads the machines with `incus`.
      - name: Install Terraform
        env:
          TERRAFORM_VERSION: '1.13.3'
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          base="https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}"
          asset="terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl --retry 3 --retry-connrefused -fsSL -o "${workdir}/${asset}" "${base}/${asset}"
          curl --retry 3 --retry-connrefused -fsSL -o "${workdir}/sums" "${base}/terraform_${TERRAFORM_VERSION}_SHA256SUMS"
          (cd "${workdir}" && grep " ${asset}$" sums | sha256sum -c -)
          sudo unzip -o "${workdir}/${asset}" terraform -d /usr/local/bin
          terraform version

      # The gate itself. FEINT_VM is exported rather than left to the default so
      # the mode is announced with the provenance a reader can check against
      # this job's own name — the property tools/runtime-mode.sh holds and #574
      # paid three 1300-second passes to learn.
      #
      # The pass budget is the gate's own default (3) rather than a number set
      # here: a CI budget that differs from the local one means the green an
      # operator proves and the green this job publishes are two different
      # measurements.
      - name: The example stacks, applied and probed
        run: sudo env FEINT_VM=incus-ovn tools/conformance/functional.sh

      # On failure: what the host STILL holds, and this is thin by construction
      # rather than by oversight. The gate tears its own stack down on the way
      # out, so a red leaves almost nothing behind — the finding is the verdict
      # line itself, which already names the stack, the machine, the address and
      # the port. What this catches is the other shape: a red that left
      # something standing, which is the doorstep's own subject.
      - name: What the runtime still holds
        if: failure()
        run: |
          sudo incus list || true
          sudo incus network list || true
          sudo incus network acl list || true

  # The criterion, counted rather than remembered.
  #
  # The header above states the rule: promotion to `pull_request` when 14
  # consecutive scheduled runs are green. That sentence was the whole of the
  # measurement until now — a number nobody computes, waiting for somebody to
  # think of opening the Actions history. "A comment is not a control", one level
  # up: the control it describes is a control of the project rather than of the
  # code, and it had no instrument either.
  #
  # So this counts the streak and publishes it in the run summary, every night.
  # It never fails: a red here would punish the runner's weather rather than
  # measure it, and the whole point of the rule is that this workflow stays
  # advisory. What it does is remove the excuse — when the streak reaches the
  # target, the summary says so in as many words, and #125 has an answer instead
  # of an opinion.
  streak:
    name: Consecutive green scheduled runs
    needs: [runtime, stacks]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Count the streak, from the Actions history
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: '14'
        run: |
          set -euo pipefail

          # Scheduled runs only, newest first. A dispatch or a branch push is a
          # human asking a question; the rule counts nights, and mixing the two
          # would let somebody earn the streak by pressing a button 14 times.
          conclusions="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/runtime-proof.yml/runs?event=schedule&per_page=100" \
            --jq '.workflow_runs[] | select(.status == "completed") | .conclusion')"

          streak=0
          for c in $conclusions; do
            if [ "$c" = "success" ]; then
              streak=$((streak + 1))
            else
              break
            fi
          done

          total="$(printf '%s\n' "$conclusions" | grep -c . || true)"
          {
            echo "## Promotion criterion (#125)"
            echo
            echo "| | |"
            echo "|---|--:|"
            echo "| Consecutive green scheduled runs | **${streak}** |"
            echo "| Target | ${TARGET} |"
            echo "| Completed scheduled runs on record | ${total} |"
            echo
            if [ "$streak" -ge "$TARGET" ]; then
              echo "**The criterion is met.** Move this workflow onto \`pull_request\` and close #125."
              echo "The number above is what earns it; nothing else has to be decided."
            else
              echo "Not met: $((TARGET - streak)) more consecutive green nights."
              echo "This workflow stays advisory and #125 stays open, which is the rule its"
              echo "header states rather than a preference."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "streak=${streak}/${TARGET}"

  # A red night tells somebody (#502). Ten scheduled reds in twelve nights
  # (#501) left no trace outside job logs and the summary above — the two
  # places nobody opens without already knowing there is a problem. This job
  # opens or updates one issue on a red scheduled night, naming the failing
  # step and its job (mode) plus the streak, and closes it on the first green
  # one; a run where no step failed is written as the run's own infrastructure,
  # never blamed on a suite.
  #
  # The mechanism is drift.yml's report job — one issue, updated, never a new
  # one per night — as a reusable workflow, because a block copied into each
  # scheduled caller is a control one caller forgets. Its decisions live in
  # tools/ci/night-report.sh, not in a run: block, so they are provable off
  # GitHub Actions: tools/ci/night_report_test.go drives the script over
  # field-trimmed payloads of real runs of this workflow, and
  # tools/falsify/specs/a-red-night-opens-an-issue.json replays those tests
  # with each decision neutralised.
  report:
    name: A red night opens the issue, a green one closes it
    needs: [runtime, stacks]
    if: always() && github.event_name == 'schedule'
    permissions:
      contents: read
      actions: read
      issues: write
    uses: ./.github/workflows/night-report.yml
    with:
      # The promotion criterion of #125, the number the `streak` job above
      # publishes; the issue carries it so nobody has to open a summary.
      streak-target: '14'
