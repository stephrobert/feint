name: adoption-metrics

# One snapshot a day of what GitHub says was downloaded, appended to a history
# that lives on its own branch.
#
# WHY NOT main. The `main` ruleset carries `pull_request` and
# `required_status_checks`, and its only bypass is scoped to a pull request, so
# a daily `git push origin main` is refused outright. The alternative inside
# main would be a pull request a day, each one having to pass the full required
# suite to land a row of numbers, which is neither cheap nor reviewable. So the
# data lives on the orphan `metrics` branch: no noise in main's history, the
# full history kept, and metrics/feint-latest.json reachable as a raw URL for
# whatever renders it later. This is the gh-pages arrangement, for the same
# reason gh-pages exists.
#
# WHAT IT NEVER DOES. It reads a public counter and writes a CSV. feint itself
# phones nobody, and nothing here identifies a person: see
# docs/adoption-metrics.md, which also says why download_count is not a user
# count.

on:
  schedule:
    # 04:17 UTC. Not on the hour, because everybody schedules on the hour and
    # GitHub delays a busy minute.
    - cron: '17 4 * * *'
  workflow_dispatch:

# Nothing at the top, everything per job, like every other workflow here: a job
# added later starts with no right at all and has to name the one it needs.
# tools/ci/job_bounds_test.go TestEveryWorkflowGrantsNothingAtTheTop fails
# on the `contents: read` this file carried until #988.
permissions: {}

concurrency:
  group: adoption-metrics
  cancel-in-progress: false

jobs:
  snapshot:
    # A pinned image, never `-latest`, which moves under the job on GitHub's
    # schedule rather than this repository's (#988).
    runs-on: ubuntu-24.04
    # Measured: 42 s at most, median 32 s, over the 20 scheduled runs from
    # 2026-10-28 to 2026-11-16. Three times that, rounded up to five minutes.
    timeout-minutes: 5
    permissions:
      # The only job that writes, and it writes to one branch that carries no
      # code. main is unreachable from here: its ruleset refuses a direct push.
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          # Blocked to the hosts this job was measured reaching on 2026-11-16:
          # every `domain resolved` line harden-runner logged in its last three
          # green runs (43803795413, 43676261850, 43556060129).
          # Variable hosts are one wildcard per family. Left out on purpose:
          # harden-runner's own endpoint, which its agent allows, and
          # api.snapcraft.io, snapd on the runner image, never called by a step.
          # Block narrows what this job reaches; it does not stop a decided leak:
          # docs/limits.md, "The CI's egress block narrows the surface" (#988).
          # api.github.com, raw.githubusercontent.com and
          # release-assets.githubusercontent.com are what actions/setup-go
          # v7.0.0 reaches on a toolcache miss (src/installer.ts), read and
          # not measured: every measured run found the pin in the toolcache.
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            hosted-compute-*.githubapp.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443

      - name: Checkout the collector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.11'
          cache: false

      # The data branch, in a directory of its own. It carries no code, only
      # metrics/, and it is expected to exist: it was seeded with the first
      # snapshot when this workflow was added. A missing branch fails the run
      # here rather than silently starting a second, parallel history.
      #
      # persist-credentials: false on both checkouts, like drift.yml, which
      # pushes a branch the same way: the push authenticates through GH_TOKEN
      # and the runner's gh credential helper rather than through a token left
      # behind in .git/config, which zizmor's artipacked audit flags.
      - name: Checkout the data branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: metrics
          path: data
          persist-credentials: false

      - name: Collect today's snapshot
        env:
          # Unauthenticated calls are capped at 60/hour per IP, which a shared
          # runner exhausts. This raises it to 1000 for this repository, and the
          # endpoint it reads is public either way.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./tools/metrics collect --dir data/metrics

      - name: Commit, only if something moved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd data
          # persist-credentials: false above means this clone carries no
          # credential, which is the point: a token left in .git/config is what
          # zizmor's artipacked audit flags. It also means `git push` has nothing
          # to authenticate with, and the first run failed exactly there, after
          # writing the commit — `could not read Username for https://github.com`.
          # This installs gh as git's credential helper for the length of the
          # job, so the token lives in the environment and never on disk.
          gh auth setup-git
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add metrics
          if git diff --cached --quiet; then
            echo "no change; nothing to commit"
            exit 0
          fi
          git commit -m "chore(metrics): update adoption metrics $(date -u +%F)"
          git push origin metrics

      - name: Say what it found
        run: go run ./tools/metrics report --dir data/metrics

  # Six lines, for the reason #737 measured on falsify.yml: a scheduled workflow
  # that reports nowhere can fail every night and tell nobody. This one writes to
  # a branch nobody watches, so a night it stops collecting would show up only as
  # a gap in the CSV, weeks later, in a chart. tools/ci/nightly_reporting_test.go
  # holds the rule for every scheduled workflow at once.
  night:
    name: A red night opens the issue, a green one closes it
    needs: [snapshot]
    if: always() && github.event_name == 'schedule'
    permissions:
      contents: read
      actions: read
      issues: write
    uses: ./.github/workflows/night-report.yml
