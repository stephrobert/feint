name: Release

# Tag-triggered release (push a v* tag): multi-arch build, SHA-256 checksums, CycloneDX SBOM,
# SLSA build provenance and a keyless Cosign signature. Nothing is published on merge; only a tag
# releases. Actions pinned by commit SHA.

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: false   # a release build must not consume a cache a PR could poison

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${GITHUB_REF_NAME}"
          OUT="feint-${GOOS}-${GOARCH}"
          go build -trimpath \
            -ldflags="-s -w -X github.com/stephrobert/feint/internal/cli.Version=${VERSION}" \
            -o "dist/${OUT}" ./cmd/feint

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: feint-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  # The control-plane image (Dockerfile): the linux binaries this workflow just
  # built and checksummed, wrapped for a `services:` block or a compose file.
  # Nothing is compiled here — the bytes in the image are the bytes in the
  # release, so the checksums, the SBOM and the provenance of the binaries
  # describe the image's content too.
  #
  # Two gates run before anything is pushed, because a pushed tag cannot be
  # replayed: the binary inside the image must print the tag being released
  # (an image whose version is not its tag is the lie #5 of the image brief),
  # and the emulator must answer through a published port, which is the one
  # thing `scratch` could silently break that no unit test executes. The full
  # proof — the scw suite and the probe against the running image — is
  # conformance.yml's `image` job, on every pull request.
  image:
    name: Publish the container image
    runs-on: ubuntu-24.04
    needs: binaries
    permissions:
      contents: read
      packages: write      # push the image to ghcr.io
      id-token: write      # keyless signing and provenance
      attestations: write  # provenance and SBOM attestations
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the linux binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: feint-linux-*
          path: dist/
          merge-multiple: true

      # The tag is what names this release everywhere else; an image that
      # answers `feint version` with anything different has decoupled its
      # content from its name, which is exactly what a mutable tag does and
      # what this repository refuses. Checked by running the image rather than
      # by trusting the build arg: the version lives in the binary's ldflags,
      # and this step is what fails if the two builds ever disagree.
      - name: The image must carry the tag's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          chmod +x dist/feint-linux-*
          docker build -t feint:smoke --build-arg VERSION="$TAG" .
          got="$(docker run --rm feint:smoke version)"
          if [ "$got" != "$TAG" ]; then
            echo "the image answers 'feint version' with $got, the tag is $TAG" >&2
            exit 1
          fi

      # Through a published port, from outside the container — the path a
      # `services:` block actually uses — and through the image's own
      # HEALTHCHECK, which is what those blocks wait on.
      - name: The image must answer from outside the container
        run: |
          docker run -d --name smoke -p 127.0.0.1:4599:4599 feint:smoke
          dist/feint-linux-amd64 wait --addr 127.0.0.1:4599 --timeout 30s
          curl -sf http://127.0.0.1:4599/_feint/health
          for _ in $(seq 30); do
            state="$(docker inspect --format '{{.State.Health.Status}}' smoke)"
            [ "$state" = "healthy" ] && break
            sleep 1
          done
          [ "$state" = "healthy" ] || { echo "healthcheck never went healthy: $state" >&2; exit 1; }
          docker rm -f smoke

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One tag, the release's own, and nothing mutable: no `latest`, no
      # floating major. The doctrine is the install page's — a mutable
      # reference hands the puller whatever is newest, which is a binary
      # nobody can name afterwards.
      #
      # BuildKit's own provenance and SBOM are off because this job attests
      # both itself, below, with the repository's identity — two provenance
      # documents from two mechanisms would leave a verifier guessing which
      # one the documentation means.
      - name: Build and push the multi-arch image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          build-args: |
            VERSION=${{ github.ref_name }}
          provenance: false
          sbom: false

      # SLSA provenance is unavailable on user-owned private repos; skipped until the repo is public.
      - name: Attest the image's build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Generate the image SBOM (Syft, CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: image-sbom.cdx.json
          upload-release-assets: false

      - name: Attest the image SBOM
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: image-sbom.cdx.json
          push-to-registry: true

      - name: Install Cosign
        if: ${{ !github.event.repository.private }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # By digest, never by tag: a signature over a tag blesses whatever the
      # tag points at later.
      - name: Sign the image (keyless)
        if: ${{ !github.event.repository.private }}
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # The recipe a reader copies from docs/install.md, executed against the
      # image that was just pushed — extracted from the page rather than
      # retyped, so the page and this workflow cannot drift apart the way the
      # blob recipe once did (#129). And it has to be able to fail: an
      # identity that also accepts another workflow of this repository
      # verifies everything, which is the width #129 closed.
      - name: The published verification recipe verifies this image
        if: ${{ !github.event.repository.private }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          identity="$(grep -o -- "--certificate-identity-regexp '[^']*'" docs/install.md | head -1 | sed "s/.*'\(.*\)'/\1/")"
          if [ -z "$identity" ]; then
            echo "docs/install.md publishes no cosign identity" >&2
            exit 1
          fi
          cosign verify "${IMAGE}:${TAG}" \
            --certificate-identity-regexp "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          wrong="${identity/release/drift}"
          if cosign verify "${IMAGE}:${TAG}" \
               --certificate-identity-regexp "$wrong" \
               --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null 2>&1; then
            echo "the published identity accepts another workflow of this repository (#129)" >&2
            exit 1
          fi

  release:
    name: Create release
    runs-on: ubuntu-24.04
    needs: binaries
    permissions:
      contents: write      # create the release
      id-token: write      # SLSA provenance and keyless signing
      attestations: write  # build attestation
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/
          merge-multiple: true

      # The last place the documentation can still be stopped, and the only thing
      # it is allowed to do here is stop the release.
      #
      # It refuses rather than repairs, deliberately. Regenerating the pages from
      # this job would mean write credentials on the workflow whose business is
      # publishing, a commit landing outside any pull request and outside branch
      # protection, and a release whose sources are not the commit it was cut
      # from. So the repair happens where it is cheap and reviewable — the
      # pre-commit hook, the pull request, `mise run release:check` before the tag
      # — and this step only asserts that it happened.
      #
      # The binary being published is the one doing the judging, which is the
      # point: it carries the version constants the prerequisites table is
      # spliced from. `docs --check` exits 2 on a stale page, on client pins that
      # disagree between CI and the install role, and on an install command
      # naming an asset this workflow does not build.
      - name: The documentation must describe this release
        run: |
          set -euo pipefail
          chmod +x dist/feint-linux-amd64
          dist/feint-linux-amd64 docs --check

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum feint-* > checksums.txt
          cat checksums.txt

      - name: Generate SBOM (Syft, CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/sbom.cdx.json
          upload-release-assets: false

      # SLSA provenance is unavailable on user-owned private repos; skipped until the repo is public.
      - name: Attest build provenance
        id: attest
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/feint-*

      - name: Attest SBOM
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/feint-*
          sbom-path: dist/sbom.cdx.json

      - name: Install Cosign
        if: ${{ !github.event.repository.private }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # One signature over checksums.txt covers every artifact, since each file's hash is in it.
      - name: Sign checksums (keyless)
        if: ${{ !github.event.repository.private }}
        working-directory: dist
        run: cosign sign-blob --yes --bundle checksums.txt.cosign.bundle checksums.txt

      - name: Copy provenance into dist
        if: ${{ !github.event.repository.private && steps.attest.outputs.bundle-path != '' }}
        env:
          # Never interpolate a step output straight into run:; bind it to an env var so no
          # attacker-shaped value can break out of the shell command.
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" dist/provenance.intoto.jsonl

      # The section of CHANGELOG.md matching this tag becomes the release body.
      # generate_release_notes lists merged pull requests, which is a log rather
      # than a description: a reader downloading a binary should meet a sentence
      # somebody wrote about what changed for them.
      - name: Extract the changelog section
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

      # And the versions that proved it (#325).
      #
      # A consumer pinning this emulator into a CI lane needs to know which
      # client and which Terraform provider the suites actually drove: one of
      # them lost a day to a provider release that moved a resource under them,
      # because nothing we published said what our lane ran. The block is copied
      # out of docs/clients.md at the tag being cut, which `feint docs --check`
      # keeps equal to the workflow pins and the fixtures — so the release body
      # and the page cannot disagree.
      #
      # An empty extraction fails the release rather than publishing notes with
      # the heading and nothing under it: a section that promises versions and
      # lists none is worse than no section.
      - name: Append the versions this release was proved against
        run: |
          awk '/<!-- proved:start -->/{f=1; next} /<!-- proved:end -->/{f=0} f' \
            docs/clients.md > /tmp/proved.md
          if [ ! -s /tmp/proved.md ]; then
            echo "docs/clients.md carries no generated block between its markers" >&2
            exit 1
          fi
          {
            printf '\n## Proved against\n\n'
            cat /tmp/proved.md
            printf '\nGenerated from the conformance workflow and the fixtures at this tag.\n'
            printf 'A newer client is not known to work until the pin moves and the suite\n'
            printf 'passes on it: docs/clients.md says what each cell is worth.\n'
          } >> /tmp/notes.md

      - name: Create release with assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: /tmp/notes.md
          # true, not false: every file listed above is produced unconditionally on a
          # public repository, and a release published without its signature or its
          # provenance would keep the promise RELEASING.md makes only in appearance.
          fail_on_unmatched_files: true
          files: |
            dist/feint-*
            dist/checksums.txt
            dist/checksums.txt.cosign.bundle
            dist/sbom.cdx.json
            dist/provenance.intoto.jsonl
