name: Release

# Tag-triggered release (push a v* tag): multi-arch build, SHA-256 checksums, CycloneDX SBOM,
# SLSA build provenance and a keyless Cosign signature. Nothing is published on merge; only a tag
# releases. Actions pinned by commit SHA.

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false   # a release build must not consume a cache a PR could poison

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${GITHUB_REF_NAME}"
          OUT="feint-${GOOS}-${GOARCH}"
          go build -trimpath \
            -ldflags="-s -w -X github.com/stephrobert/feint/internal/cli.Version=${VERSION}" \
            -o "dist/${OUT}" ./cmd/feint

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: feint-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  release:
    name: Create release
    runs-on: ubuntu-24.04
    needs: binaries
    permissions:
      contents: write      # create the release
      id-token: write      # SLSA provenance and keyless signing
      attestations: write  # build attestation
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/
          merge-multiple: true

      # The last place the documentation can still be stopped, and the only thing
      # it is allowed to do here is stop the release.
      #
      # It refuses rather than repairs, deliberately. Regenerating the pages from
      # this job would mean write credentials on the workflow whose business is
      # publishing, a commit landing outside any pull request and outside branch
      # protection, and a release whose sources are not the commit it was cut
      # from. So the repair happens where it is cheap and reviewable — the
      # pre-commit hook, the pull request, `mise run release:check` before the tag
      # — and this step only asserts that it happened.
      #
      # The binary being published is the one doing the judging, which is the
      # point: it carries the version constants the prerequisites table is
      # spliced from. `docs --check` exits 2 on a stale page, on client pins that
      # disagree between CI and the install role, and on an install command
      # naming an asset this workflow does not build.
      - name: The documentation must describe this release
        run: |
          set -euo pipefail
          chmod +x dist/feint-linux-amd64
          dist/feint-linux-amd64 docs --check

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum feint-* > checksums.txt
          cat checksums.txt

      - name: Generate SBOM (Syft, CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/sbom.cdx.json
          upload-release-assets: false

      # SLSA provenance is unavailable on user-owned private repos; skipped until the repo is public.
      - name: Attest build provenance
        id: attest
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/feint-*

      - name: Attest SBOM
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/feint-*
          sbom-path: dist/sbom.cdx.json

      - name: Install Cosign
        if: ${{ !github.event.repository.private }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # One signature over checksums.txt covers every artifact, since each file's hash is in it.
      - name: Sign checksums (keyless)
        if: ${{ !github.event.repository.private }}
        working-directory: dist
        run: cosign sign-blob --yes --bundle checksums.txt.cosign.bundle checksums.txt

      - name: Copy provenance into dist
        if: ${{ !github.event.repository.private && steps.attest.outputs.bundle-path != '' }}
        env:
          # Never interpolate a step output straight into run:; bind it to an env var so no
          # attacker-shaped value can break out of the shell command.
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" dist/provenance.intoto.jsonl

      # The section of CHANGELOG.md matching this tag becomes the release body.
      # generate_release_notes lists merged pull requests, which is a log rather
      # than a description: a reader downloading a binary should meet a sentence
      # somebody wrote about what changed for them.
      - name: Extract the changelog section
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

      - name: Create release with assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: /tmp/notes.md
          # true, not false: every file listed above is produced unconditionally on a
          # public repository, and a release published without its signature or its
          # provenance would keep the promise RELEASING.md makes only in appearance.
          fail_on_unmatched_files: true
          files: |
            dist/feint-*
            dist/checksums.txt
            dist/checksums.txt.cosign.bundle
            dist/sbom.cdx.json
            dist/provenance.intoto.jsonl
