name: Dependency review

# Blocks a pull request that introduces a dependency with a known vulnerability or a
# non-permissive licence. feint has no third-party Go dependency today; this gate is what keeps
# that decision honest as the project grows.

on:
  pull_request:

permissions: {}

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-24.04
    # Measured: 23 s at most, median 17 s, 9 runs on 2026-11-16.
    # Three times the longest, rounded up to five minutes (#988).
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          # Blocked to the hosts this job was measured reaching on 2026-11-16:
          # every `domain resolved` line harden-runner logged in its last three
          # green runs (43924911769, 43924092493, 43922019465).
          # Variable hosts are one wildcard per family. Left out on purpose:
          # harden-runner's own endpoint, which its agent allows, and
          # api.snapcraft.io, snapd on the runner image, never called by a step.
          # Block narrows what this job reaches; it does not stop a decided leak:
          # docs/limits.md, "The CI's egress block narrows the surface" (#988).
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            results-receiver.actions.githubusercontent.com:443
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          allow-licenses: Apache-2.0, MIT, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0
