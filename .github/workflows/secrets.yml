name: Secrets

# Secret scanning on every push and pull request. The emulator ships fake but well-formed cloud
# credentials in its fixtures, which is exactly the shape a scanner flags, so this gate proves the
# fakes stay fake and no real key ever slips in beside them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan
        env:
          # Same pattern as every other scanner here: a release binary whose
          # checksum is verified, not a third-party action.
          #
          # The action was doing the job until the first public run, where it
          # refused with "BASE and HEAD commits are the same" — its base..head
          # contract cannot express "a repository published as one commit", and
          # passing base/head explicitly did not change it because the action
          # recomputes them from the event. The gate that must work on the
          # publishing commit was the one that could not run on it.
          #
          # `filesystem` also asks the better question: not whether this change
          # added a secret, but whether the repository holds one.
          TRUFFLEHOG_VERSION: '3.95.6'
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          base="https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}"
          asset="trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          curl --retry 3 --retry-connrefused -fsSL -o "${workdir}/${asset}" "${base}/${asset}"
          curl --retry 3 --retry-connrefused -fsSL -o "${workdir}/sums" "${base}/trufflehog_${TRUFFLEHOG_VERSION}_checksums.txt"
          (cd "${workdir}" && grep " ${asset}$" sums | sha256sum -c -)
          tar -xzf "${workdir}/${asset}" -C "${workdir}" trufflehog
          sudo install -m 0755 "${workdir}/trufflehog" /usr/local/bin/trufflehog
          trufflehog --no-update --version
          # --no-update, and it is not tidiness: the binary self-updates on
          # start, and from /usr/local/bin it cannot replace itself — it exits 1
          # with "cannot move binary back". A scanner that fails because it
          # tried to change the version being audited is a scanner nobody can
          # pin, which is the whole point of installing it by checksum.
          trufflehog --no-update filesystem . --results=verified --fail
