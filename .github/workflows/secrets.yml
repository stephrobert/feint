name: Secrets

# Secret scanning on every push and pull request. The emulator ships fake but well-formed cloud
# credentials in its fixtures, which is exactly the shape a scanner flags, so this gate proves the
# fakes stay fake and no real key ever slips in beside them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan
        uses: trufflesecurity/trufflehog@30d5bb91af1a771378349dbbb0c82129392acf70 # v3.95.6
        with:
          # Scan the whole repository rather than a diff.
          #
          # The action defaults to base..head, and on a push whose base equals
          # its head — the first push of a squashed history, exactly what this
          # repository did — it refuses with "BASE and HEAD commits are the
          # same" and fails the run. A secret gate that cannot run on the commit
          # that publishes the repository is the one moment it had to work.
          #
          # Scanning everything also answers the harder question: not "did this
          # change add a secret" but "does this repository contain one".
          base: ''
          head: ${{ github.ref_name }}
          extra_args: --results=verified --fail
