name: Go

# Quality gate for the feint binary: formatting, vet, build, race-tested units, fuzzing,
# golangci-lint and govulncheck. Mirrors .pre-commit-config.yaml and the go-production-engineer
# standard. Actions pinned by commit SHA; tools pinned by version.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  quality:
    name: Build, test, lint, vuln-scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The full patch mise pins, not the minor.
          #
          # Two pull requests fixed the same failure on the same morning, in two
          # ways, and the merge is where they had to be reconciled. go1.26.6
          # fixed five standard-library vulnerabilities; a `go-version: '1.26'`
          # minor pin let setup-go take whatever 1.26.x the runner image had cached —
          # 1.26.5 — so govulncheck went red on every pull request, including
          # ones touching no Go file. A rerun installed 1.26.5 again, which is
          # what separated "the manifest has 1.26.6" from "this job uses it".
          #
          # `check-latest: true` was the other fix. It works, and it was not
          # kept: it makes CI resolve a version the mise pin does not name, so
          # the toolchain here and the one a contributor runs locally drift
          # apart silently — the divergence CONTRIBUTING.md forbids. An exact
          # pin is reproducible and moves when somebody decides it moves.
          # TestTheGoWorkflowPinsTheVersionMiseDoes fails when the two disagree.
          go-version: '1.26.6'
          # No go.sum to key a cache on: the zero-dependency rule keeps this module
          # dependency-free, and a pre-commit hook fails if the file ever
          # appears. Pointing the cache at it warned on every run and never
          # hit, which is a cache that costs and returns nothing.
          cache: false

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      # Shell is code here: every conformance claim is driven by a bash script,
      # and the first shellcheck run found a case pattern that had never matched
      # what it was written to match.
      - name: shellcheck
        env:
          # The same version mise pins for the hook. `apt install shellcheck`
          # was taking whatever ubuntu-24.04 carries, which reported ten SC2015
          # findings the local 0.11.0 does not: the hook could not predict CI,
          # which is the one thing a mirrored gate has to do.
          SHELLCHECK_VERSION: '0.11.0'
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          asset="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o "${workdir}/${asset}" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${asset}"
          tar -xJf "${workdir}/${asset}" -C "${workdir}"
          sudo install -m 0755 "${workdir}/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
          # -z and xargs -0 rather than $(git ls-files): a command substitution
          # word-splits, so a path with a space would be linted as two files that
          # do not exist. actionlint caught it in this very step, which is the
          # argument for the step existing.
          git ls-files -z '*.sh' | xargs -0 shellcheck --severity=style

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # The README's coverage tables are generated from the committed artefacts.
      # A route added without regenerating them makes the README claim a surface
      # the emulator no longer has, which is the failure that made them generated
      # in the first place. Exit 2 is "out of date", not "broken".
      - name: The README's coverage tables are current
        run: tools/docs/check.sh

      - name: go test (race)
        # See the same variable on the cross matrix below: the feinttest package
        # pulls the published image, which a local `mise run check` must not do.
        env:
          FEINT_TESTCONTAINER: '1'
        run: go test -race ./...

      # The emulator must answer the shapes a real cloud was observed to return
      # (shapes/*.json) — the drift the SDK scan cannot see, because it measures
      # what a provider offers, never what it returns. Offline, no credential,
      # so it runs on every pull request, forks included. Exit 2 means a field
      # the record proves and no pack declines: serve it, or decline it with a
      # reason in the pack's DeclinedFields(). Exit 1 means the declines
      # themselves are unusable (no reason, or stale).
      - name: The emulator answers the recorded shapes
        run: |
          go build -o feint ./cmd/feint
          ./feint shapes --check

      # Fuzz the one input feint does not control: the JSON body a client posts. A panic in a
      # handler takes down every provider sharing the process, so a crasher must surface in CI
      # rather than in someone's terminal. Crashers land in testdata/fuzz/ and become permanent
      # regression tests.
      - name: go test (fuzz)
        run: go test ./internal/providers/scaleway/ -run '^$' -fuzz 'FuzzCreateServer' -fuzztime=60s

      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          "$(go env GOPATH)/bin/golangci-lint" run ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  # Does this branch say what it changed about the surface it serves (#326).
  #
  # A job of its own for one reason: it needs the tags. The checkout above is
  # shallow, and this comparison recovers the previous release's coverage
  # artefacts with `git show <tag>:coverage/...` — with no tag it cannot measure,
  # and it exits 1 saying so rather than reporting that nothing changed. So
  # `fetch-depth: 0` is not a preference here, it is the precondition.
  #
  # It runs on every pull request rather than at tag time only, because the
  # cheapest moment to name a newly-served operation is the pull request that
  # serves it. And it reads the CHANGELOG rather than the commits: 0.9.0's
  # `instance/v2alpha1` family arrived under a commit whose title names it
  # exactly (992bf42), and was still invisible to everybody downstream, because
  # what a consumer reads is the release body.
  release-surface:
    name: The release note names what changed
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, so the tags exist: see the comment above.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: false

      - name: Every operation that changed hands is named, or signed
        run: bash --noprofile --norc tools/release/surface.sh

  # The three platforms the release builds and nothing used to run.
  #
  # `release.yml` publishes four binaries; this job is what stops three of them
  # from being a claim. The install page says which platforms are *exercised*,
  # and it reads that from the `runs-on:` labels below rather than from a
  # sentence somebody wrote: add a runner here and the documentation follows,
  # remove one and it follows too.
  #
  # Free of charge, and that is why the condition is there rather than a
  # comment promising to enable it later: standard runners are free and
  # unlimited on public repositories, and billed against the plan's minutes on
  # private ones. This repository is private until it is published, so the job
  # skips instead of spending — and starts running by itself on the day the
  # visibility changes, which is the same guard release.yml already uses for
  # SLSA provenance and Cosign.
  #
  # What it deliberately does not cover: `--vm`. That mode needs an Incus
  # server, which exists on Linux only — the lxc/incus releases publish
  # `bin.macos.incus` (the client, the agent, the benchmark) and no server, and
  # Zabbly packages amd64 and arm64 for Debian alone. So a macOS binary emulates
  # the three control planes and can never back a server with a real machine.
  cross:
    name: Test on ${{ matrix.runner }}
    if: ${{ !github.event.repository.private }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel
    permissions:
      contents: read
    steps:
      - name: Harden runner
        # Linux only: the action installs an eBPF agent and is a no-op that
        # still costs a minute elsewhere.
        if: ${{ startsWith(matrix.runner, 'ubuntu') }}
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: false

      - name: go build
        run: go build ./...

      - name: go test (race)
        # No FEINT_TESTCONTAINER here, and it is a measurement rather than a
        # convenience. On ubuntu-24.04-arm the published image starts and the
        # container dies immediately: `exited (code 255)` with an empty log,
        # twice, on 17 August 2026 — the diagnosis feinttest now prints because
        # it stopped passing `--rm`. The same image runs on this station under
        # `--platform linux/arm64`, so it is the runner's container runtime that
        # refuses, not the arm64 binary, and nothing here can reproduce it.
        #
        # docs/limits.md records it. The amd64 leg above sets the variable, so
        # the package is still exercised on every pull request; what is not
        # claimed is that it works on a runner where it was measured not to.
        # This is the shape the `serve`-not-`start` step below already uses for
        # macOS, and for the same reason.
        run: go test -race ./...

      # The binary has to answer, not merely link. A control plane that builds
      # and cannot serve is exactly the gap between "built" and "exercised".
      # `serve` in the foreground, not `start`: the self-detaching mode exits
      # immediately on both macOS runners, measured on this repository's first
      # public CI run. That is a limitation of the daemonising path rather than
      # of the emulator, docs/limits.md records it, and this step proves the part
      # that must hold everywhere — the binary serves the API on this platform.
      - name: The emulator answers on this platform
        run: |
          set -euo pipefail
          go build -o feint ./cmd/feint
          ./feint serve --addr 127.0.0.1:4599 &
          pid=$!
          for _ in $(seq 1 30); do
            curl -fsS localhost:4599/_feint/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS localhost:4599/_feint/health
          kill "$pid"
