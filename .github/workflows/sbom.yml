name: SBOM

# A software bill of materials on every push to main, not only at release time.
#
# The release workflow already attaches a CycloneDX SBOM to each tag. This one runs continuously,
# so what main contains is documented between releases too — which is when a dependency would
# actually appear, zero dependencies being something people can break before anyone tags.

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions: {}

# Two jobs for one tool, because only one of the two triggers needs a token that
# can write. Attaching an asset to a release does; documenting what main contains
# does not, and a push job holding contents: write is a standing capability
# nothing in it uses.
jobs:
  main:
    name: Syft SBOM (main)
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Anchore SBOM Action (Syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: spdx-json
          output-file: feint.spdx.json
          artifact-name: feint.spdx.json
          upload-artifact: true
          upload-release-assets: false

  release:
    name: Syft SBOM (release asset)
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # attach the SBOM to release assets
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Anchore SBOM Action (Syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: spdx-json
          output-file: feint.spdx.json
          artifact-name: feint.spdx.json
          upload-artifact: true
          upload-release-assets: true
