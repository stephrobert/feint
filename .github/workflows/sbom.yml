name: SBOM

# A software bill of materials on every push to main, not only at release time.
#
# The release workflow already attaches a CycloneDX SBOM to each tag. This one runs continuously,
# so what main contains is documented between releases too — which is when a dependency would
# actually appear, zero dependencies being something people can break before anyone tags.

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions: {}

# Two jobs for one tool, because only one of the two triggers needs a token that
# can write. Attaching an asset to a release does; documenting what main contains
# does not, and a push job holding contents: write is a standing capability
# nothing in it uses.
jobs:
  main:
    name: Syft SBOM (main)
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    # Measured: 26 s at most, median 22 s, 20 runs from 2026-11-14 to 2026-11-16.
    # Three times the longest, rounded up to five minutes (#988).
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          # Blocked to the hosts this job was measured reaching on 2026-11-16:
          # every `domain resolved` line harden-runner logged in its last three
          # green runs (43923897754, 43904735066, 43901268406).
          # Variable hosts are one wildcard per family. Left out on purpose:
          # harden-runner's own endpoint, which its agent allows, and
          # api.snapcraft.io, snapd on the runner image, never called by a step.
          # Block narrows what this job reaches; it does not stop a decided leak:
          # docs/limits.md, "The CI's egress block narrows the surface" (#988).
          # storage.googleapis.com is all of Google Cloud Storage, so it lets a step
          # write to anybody's bucket. It stays because a `go` process resolved
          # it, with proxy.golang.org and sum.golang.org, during the Syft step
          # (run 43923897754), and proxy.golang.org answers the toolchain
          # download with a 302 to storage.googleapis.com (measured 2026-11-16
          # on go1.26.11). That the download is the toolchain is inferred: this
          # job has no setup-go, and go.mod asks for 1.26. Pinning Go with
          # setup-go would likely drop all three hosts; not measured. This job
          # runs on push to main only, never on a pull request's code.
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            hosted-compute-*.githubapp.com:443
            proxy.golang.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Anchore SBOM Action (Syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: spdx-json
          output-file: feint.spdx.json
          artifact-name: feint.spdx.json
          upload-artifact: true
          upload-release-assets: false

  release:
    name: Syft SBOM (release asset)
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    # NEVER measured: it runs on a release. The same action as `main` above,
    # 26 s at most there.
    timeout-minutes: 5
    permissions:
      contents: write # attach the SBOM to release assets
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Anchore SBOM Action (Syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: spdx-json
          output-file: feint.spdx.json
          artifact-name: feint.spdx.json
          upload-artifact: true
          upload-release-assets: true
